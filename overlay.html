<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peltola Open Overlay</title>
  <style>
    :root {
      --panel: rgba(0, 0, 0, 0.5);
      --panel-strong: rgba(0, 0, 0, 0.5);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.debug {
      background: linear-gradient(135deg, #295b41, #1b2838);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      color: var(--text);
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .hidden { display: none !important; }

    .compact-box {
      position: absolute;
      right: 3.5vw;
      bottom: 4.5vh;
      display: inline-block;
      width: max-content;
      max-width: min(520px, 44vw);
      padding: 12px 14px 11px;
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(2px);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
    }

    .box-title {
      max-width: 100%;
      overflow: hidden;
      font-size: clamp(12px, 1.05vw, 16px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .box-subtitle {
      margin-top: 1px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: clamp(10px, 0.9vw, 13px);
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .score-table {
      display: grid;
      grid-template-columns: max-content max-content;
      column-gap: 12px;
      row-gap: 0;
      align-items: center;
    }

    .table-head,
    #scoreRows { display: contents; }

    .table-head div {
      padding-bottom: 5px;
      color: var(--muted);
      font-size: clamp(9px, 0.8vw, 11px);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-row { display: contents; }

    .team-name,
    .score {
      padding: 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: clamp(13px, 1.25vw, 18px);
      line-height: 1.12;
    }

    .team-name {
      max-width: min(370px, 34vw);
      overflow: hidden;
      font-weight: 850;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .score {
      min-width: 34px;
      font-weight: 950;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      color: var(--muted);
      font-size: clamp(13px, 1.2vw, 18px);
      font-weight: 750;
    }

    .ticker {
      position: absolute;
      left: 3vw;
      right: 3vw;
      bottom: 4vh;
      height: var(--ticker-height, clamp(42px, 4.8vw, 58px));
      display: flex;
      overflow: hidden;
      border-radius: 16px;
      background: var(--panel);
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      height: 100%;
      animation: ticker-scroll var(--ticker-duration, 27.2s) linear infinite;
      will-change: transform;
    }

    .ticker-copy {
      display: flex;
      align-items: center;
      gap: 34px;
      padding: 0 17px;
      white-space: nowrap;
    }

    .ticker-item {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      font-size: clamp(15px, 1.6vw, 23px);
      line-height: 1;
    }

    .ticker-team { font-weight: 850; }

    .ticker-score {
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .ticker-separator {
      align-self: stretch;
      width: 30px;
      margin: 0;
      background: var(--panel-strong);
      border-radius: 0;
      opacity: 1;
    }

    .ticker-info {
      display: grid;
      place-items: center;
      min-width: clamp(104px, 10vw, 150px);
      padding: 0 12px;
      border-right: 1px solid var(--line);
      background: var(--panel-strong);
      font-size: clamp(11px, 1vw, 15px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .helsinki-clock {
      position: absolute;
      left: 3vw;
      bottom: calc(4vh + var(--ticker-height, 58px) + 8px);
      min-width: clamp(104px, 10vw, 150px);
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--panel-strong);
      color: var(--text);
      font-size: clamp(12px, 1.1vw, 17px);
      font-weight: 950;
      letter-spacing: 0.06em;
      line-height: 1;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }


    .scorecard-pop {
      position: absolute;
      left: var(--scorecard-center-x, 50%);
      top: var(--scorecard-center-y, 43%);
      width: auto;
      max-width: 96vw;
      max-height: 74vh;
      transform: translate(-50%, -50%) translateY(24px) scale(var(--scorecard-hidden-scale, 0.96)) scaleX(var(--scorecard-width-factor, 1)) scaleY(var(--scorecard-height-factor, 1));
      transform-origin: center center;
      opacity: 0;
      padding: 16px 16px 18px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .scorecard-pop.show {
      transform: translate(-50%, -50%) translateY(0) scale(var(--scorecard-show-scale, 1)) scaleX(var(--scorecard-width-factor, 1)) scaleY(var(--scorecard-height-factor, 1));
      opacity: 1;
    }

    .scorecard-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .scorecard-title {
      overflow: hidden;
      font-size: clamp(17px, 2vw, 30px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scorecard-through {
      flex: none;
      color: var(--muted);
      font-size: clamp(12px, 1.15vw, 18px);
      font-weight: 950;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .scorecard-table-wrap {
      overflow: hidden;
      width: max-content;
      max-width: 100%;
    }

    .scorecard-table {
      width: auto;
      border-collapse: collapse;
      table-layout: auto;
      color: white;
      font-variant-numeric: tabular-nums;
      --scorecard-grid: rgba(255, 255, 255, 0.46);
    }

    .scorecard-table th,
    .scorecard-table td {
      height: var(--scorecard-cell-height, clamp(24px, 2.45vw, 35px));
      border: 1px solid var(--scorecard-grid);
      padding: 2px 3px;
      text-align: center;
      vertical-align: middle;
      line-height: 1;
      background-clip: padding-box;
    }

    .scorecard-table th {
      background: rgba(255, 255, 255, 0.1);
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 950;
      text-transform: uppercase;
    }

    .scorecard-table td {
      font-size: clamp(11px, 1.1vw, 18px);
      font-weight: 850;
      line-height: 1;
    }

    .scorecard-player {
      width: 1%;
      max-width: var(--scorecard-player-max, min(360px, 31vw));
      text-align: left !important;
      padding-left: 7px !important;
      padding-right: 7px !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scorecard-hole {
      width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      min-width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      max-width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      text-align: center !important;
      vertical-align: middle !important;
      overflow: hidden;
    }

    .scorecard-total {
      width: var(--scorecard-total-width, clamp(42px, 4.2vw, 66px));
      min-width: var(--scorecard-total-width, clamp(42px, 4.2vw, 66px));
      font-weight: 950 !important;
    }

    .scorecard-mark {
      display: inline-grid;
      place-items: center;
      width: clamp(18px, 1.75vw, 28px);
      height: clamp(18px, 1.75vw, 28px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 50%;
      color: #ffffff;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .scorecard-cell-fill {
      font-weight: 950 !important;
    }

    .scorecard-mark-albatross { background: #245f9e; }
    .scorecard-mark-birdie { background: #6db7f2; }
    .scorecard-mark-bogey { background: #e3a17d; color: #111111; }
    .scorecard-mark-double { background: #d86431; color: #111111; }
    .scorecard-mark-triple { background: #d00000; color: #111111; }
    .scorecard-mark-quad { background: #aa0000; color: #111111; }

    .scorecard-empty-cell {
      color: rgba(255, 255, 255, 0.28);
    }


    @media (max-width: 760px) {
      body.debug {
        background: #102018;
      }

      .compact-box {
        right: 12px;
        bottom: 16px;
        max-width: calc(100vw - 24px);
      }

      .ticker {
        left: 8px;
        right: 8px;
        bottom: 12px;
        height: 44px;
        border-radius: 12px;
      }

      .ticker-info {
        min-width: 84px;
        padding: 0 8px;
        font-size: 10px;
      }

      .helsinki-clock {
        left: 8px;
        bottom: calc(12px + var(--ticker-height, 44px) + 6px);
        min-width: 84px;
        padding: 7px 8px;
        border-radius: 10px;
        font-size: 11px;
      }

      .ticker-copy {
        gap: 24px;
        padding: 0 12px;
      }

      .ticker-item {
        font-size: 14px;
      }

      .scorecard-pop {
        left: var(--scorecard-center-x, 50%);
        top: var(--scorecard-center-y, 43%);
        width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 76px);
        padding: 10px;
        border-radius: 12px;
      }

      .scorecard-table-wrap {
        width: 100%;
      }

      .scorecard-title {
        font-size: 16px;
      }

      .scorecard-through {
        font-size: 11px;
      }

      .scorecard-table th,
      .scorecard-table td {
        height: 22px;
        padding: 1px 2px;
      }

      .scorecard-table th {
        font-size: 9px;
      }

      .scorecard-table td {
        font-size: 10px;
      }

      .scorecard-player {
        max-width: var(--scorecard-player-mobile-max, 116px);
        padding-left: 4px !important;
        padding-right: 4px !important;
      }

      .scorecard-hole {
        width: var(--scorecard-hole-mobile-width, 20px);
        min-width: var(--scorecard-hole-mobile-width, 20px);
        max-width: var(--scorecard-hole-mobile-width, 20px);
      }

      .scorecard-mark {
        width: 14px;
        min-width: 14px;
        max-width: 14px;
        height: 14px;
        min-height: 14px;
        max-height: 14px;
        font-size: 9px;
      }

      .scorecard-total {
        width: var(--scorecard-total-mobile-width, 38px);
      }

      .scorecard-mark {
        width: 16px;
        height: 16px;
      }
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-25%); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section id="compactBox" class="compact-box hidden" aria-live="polite">
      <div id="boxTitle" class="box-title">Peltola Open</div>
      <div id="boxSubtitle" class="box-subtitle">Before round</div>
      <div id="scoreTable" class="score-table">
        <div class="table-head">
          <div>Team</div>
          <div class="score">Score</div>
        </div>
        <div id="scoreRows"></div>
      </div>
    </section>

    <section id="ticker" class="ticker hidden" aria-live="polite">
      <div id="tickerInfo" class="ticker-info">Before round</div>
      <div class="ticker-viewport">
        <div id="tickerTrack" class="ticker-track"></div>
      </div>
    </section>

    <div id="helsinkiClock" class="helsinki-clock hidden" aria-live="off">--:--:--</div>

    <section id="scorecardPop" class="scorecard-pop hidden" aria-live="polite">
      <div class="scorecard-header">
        <div id="scorecardTitle" class="scorecard-title">Peltola Open</div>
        <div id="scorecardThrough" class="scorecard-through">Through 1</div>
      </div>
      <div id="scorecardTableWrap" class="scorecard-table-wrap"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const params = new URLSearchParams(location.search);
    const eventId = params.get("event") || "2026";
    const maxRows = Number(params.get("rows") || 12);
    const forcedMode = params.get("mode");

    if (params.get("debug") === "1") document.body.classList.add("debug");

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const compactBoxEl = document.getElementById("compactBox");
    const boxTitleEl = document.getElementById("boxTitle");
    const boxSubtitleEl = document.getElementById("boxSubtitle");
    const scoreTableEl = document.getElementById("scoreTable");
    let scoreRowsEl = document.getElementById("scoreRows");
    const tickerEl = document.getElementById("ticker");
    const tickerTrackEl = document.getElementById("tickerTrack");
    const tickerInfoEl = document.getElementById("tickerInfo");
    const scorecardPopEl = document.getElementById("scorecardPop");
    const scorecardTitleEl = document.getElementById("scorecardTitle");
    const scorecardThroughEl = document.getElementById("scorecardThrough");
    const scorecardTableWrapEl = document.getElementById("scorecardTableWrap");
    const helsinkiClockEl = document.getElementById("helsinkiClock");

    let lastFlashSequence = null;
    let scorecardHideTimer = null;
    let scorecardPreviewActive = false;
    let flashActive = false;
    let clockTimer = null;
    let latestEvent = null;
    let firebaseLoaded = false;
    let firebaseError = null;

    onValue(
      ref(db, `events/${eventId}`),
      snapshot => {
        firebaseLoaded = true;
        firebaseError = null;
        latestEvent = snapshot.val();
        renderOverlay();
      },
      error => {
        firebaseLoaded = true;
        firebaseError = error;
        latestEvent = null;
        console.error(error);
        renderOverlay();
      }
    );

    function renderOverlay() {
      if (firebaseError || !firebaseLoaded || !isPlainObject(latestEvent) || latestEvent.showStandings === false) {
        hideAllOverlay();
        return;
      }

      const event = latestEvent;

      applyOverlayLayout(event);
      updateClockVisibility(event);
      const mode = forcedMode || event.overlayMode || "compact";
      const completedThrough = getCompletedThrough(event);
      const label = formatPlayedLabel(completedThrough);
      const standings = assignPositions(calculateStandings(event, completedThrough));

      if (mode === "ticker") renderTicker(event, standings, completedThrough, label);
      else renderCompactBox(event, standings, completedThrough, label);

      maybeShowScorecardFlash(event);
      updateScorecardPreview(event);
    }

    function hideAllOverlay() {
      compactBoxEl.classList.add("hidden");
      tickerEl.classList.add("hidden");
      helsinkiClockEl.classList.add("hidden");
      if (!scorecardPreviewActive && !flashActive) scorecardPopEl.classList.add("hidden");
      if (clockTimer) {
        window.clearInterval(clockTimer);
        clockTimer = null;
      }
    }

    function isPlainObject(value) {
      return Boolean(value) && typeof value === "object" && !Array.isArray(value);
    }

    function applyOverlayLayout(event) {
      const layout = {
        tickerHeightPx: 58,
        scorecardCenterX: 50,
        scorecardCenterY: 43,
        scorecardScale: 100,
        scorecardWidthScale: 100,
        scorecardHeightScale: 100,
        ...(event.overlayLayout || {})
      };

      const tickerHeight = clampNumber(layout.tickerHeightPx, 30, 120);
      const centerX = clampNumber(layout.scorecardCenterX, 0, 100);
      const centerY = clampNumber(layout.scorecardCenterY, 0, 100);
      const scale = clampNumber(layout.scorecardScale, 50, 150) / 100;
      const widthFactor = clampNumber(layout.scorecardWidthScale, 50, 180) / 100;
      const heightFactor = clampNumber(layout.scorecardHeightScale, 50, 180) / 100;
      const viewportWidth = Math.max(320, window.innerWidth || 1920);
      const baseHoleWidth = Math.max(22, Math.min(34, viewportWidth * 0.0225));
      const baseTotalWidth = Math.max(42, Math.min(66, viewportWidth * 0.042));
      const basePlayerMax = Math.min(360, viewportWidth * 0.31);
      const baseCellHeight = Math.max(24, Math.min(35, viewportWidth * 0.0245));
      const mobileBaseHoleWidth = 20;
      const mobileBaseTotalWidth = 38;
      const mobileBasePlayerMax = 116;

      document.documentElement.style.setProperty("--ticker-height", `${tickerHeight}px`);
      document.documentElement.style.setProperty("--scorecard-center-x", `${centerX}%`);
      document.documentElement.style.setProperty("--scorecard-center-y", `${centerY}%`);
      document.documentElement.style.setProperty("--scorecard-show-scale", String(scale));
      document.documentElement.style.setProperty("--scorecard-hidden-scale", String(scale * 0.96));
      document.documentElement.style.setProperty("--scorecard-width-factor", String(widthFactor));
      document.documentElement.style.setProperty("--scorecard-height-factor", String(heightFactor));
      document.documentElement.style.setProperty("--scorecard-hole-width", `${baseHoleWidth}px`);
      document.documentElement.style.setProperty("--scorecard-total-width", `${baseTotalWidth}px`);
      document.documentElement.style.setProperty("--scorecard-player-max", `${basePlayerMax}px`);
      document.documentElement.style.setProperty("--scorecard-cell-height", `${baseCellHeight}px`);
      document.documentElement.style.setProperty("--scorecard-hole-mobile-width", `${mobileBaseHoleWidth}px`);
      document.documentElement.style.setProperty("--scorecard-total-mobile-width", `${mobileBaseTotalWidth}px`);
      document.documentElement.style.setProperty("--scorecard-player-mobile-max", `${mobileBasePlayerMax}px`);
    }

    function maybeShowScorecardFlash(event) {
      const flash = event.overlayFlash;
      if (!flash || flash.type !== "scorecard" || !flash.sequence) return;
      if (flash.sequence === lastFlashSequence) return;

      const durationMs = Number(flash.durationMs || 10000);
      const triggeredAt = Number(flash.triggeredAt || 0);
      if (triggeredAt && Date.now() - triggeredAt > durationMs + 1500) {
        lastFlashSequence = flash.sequence;
        return;
      }

      lastFlashSequence = flash.sequence;
      const throughHole = clampInt(flash.hole || getCompletedThrough(event), 0, clampInt(event.holeCount || 18, 1, 36));
      if (!throughHole) return;

      renderScorecardPop(event, throughHole);
      showScorecardPop(durationMs);
    }

    function showScorecardPop(durationMs = 10000, persistent = false) {
      window.clearTimeout(scorecardHideTimer);
      scorecardPopEl.classList.remove("hidden");
      requestAnimationFrame(() => scorecardPopEl.classList.add("show"));

      if (persistent) return;
      flashActive = true;
      scorecardHideTimer = window.setTimeout(() => {
        flashActive = false;
        if (!scorecardPreviewActive) hideScorecardPop();
      }, durationMs);
    }

    function hideScorecardPop() {
      scorecardPopEl.classList.remove("show");
      window.setTimeout(() => {
        if (!scorecardPreviewActive && !flashActive) scorecardPopEl.classList.add("hidden");
      }, 320);
    }

    function updateScorecardPreview(event) {
      const previewEnabled = event.showScorecardPreview === true;
      scorecardPreviewActive = previewEnabled;
      if (previewEnabled) {
        const holeCount = clampInt(event.holeCount || 18, 1, 36);
        const previewThrough = getCompletedThrough(event) || clampInt((event.currentHole || 1) - 1, 0, holeCount) || holeCount;
        renderScorecardPop(event, previewThrough);
        showScorecardPop(0, true);
      } else if (!flashActive) {
        hideScorecardPop();
      }
    }

    function updateClockVisibility(event) {
      const showClock = event.showHelsinkiClock !== false;
      helsinkiClockEl.classList.toggle("hidden", !showClock);
      if (showClock && !clockTimer) {
        updateHelsinkiClock();
        clockTimer = window.setInterval(updateHelsinkiClock, 1000);
      }
      if (!showClock && clockTimer) {
        window.clearInterval(clockTimer);
        clockTimer = null;
      }
    }

    function updateHelsinkiClock() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(new Date());
      const value = Object.fromEntries(parts.filter(part => part.type !== "literal").map(part => [part.type, part.value]));
      helsinkiClockEl.textContent = `${value.hour}:${value.minute}:${value.second}`;
    }

    function renderScorecardPop(event, throughHole) {
      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      const standings = assignPositions(calculateStandings(event, throughHole));

      scorecardTitleEl.textContent = event.name || "Peltola Open";
      scorecardThroughEl.textContent = throughHole === 1 ? "Through 1 hole" : `Through ${throughHole} holes`;

      const colorMode = getScorecardColorMode(event);
      const headerCells = Array.from({ length: holeCount }, (_, index) => `<th class="scorecard-hole">${index + 1}</th>`).join("");
      const rows = standings.map(team => {
        const holeCells = Array.from({ length: holeCount }, (_, index) => {
          const hole = index + 1;
          if (hole > throughHole) return `<td class="scorecard-hole scorecard-empty-cell">·</td>`;

          const holeKey = String(hole);
          const score = Number(event.teams?.[team.id]?.scores?.[holeKey]);
          const par = Number(event.holes?.[holeKey]?.par || 0);
          if (!Number.isFinite(score) || score <= 0 || !Number.isFinite(par) || par <= 0) return `<td class="scorecard-hole scorecard-empty-cell">·</td>`;

          return renderScorecardHoleCell(score, par, colorMode);
        }).join("");

        return `
          <tr>
            <td class="scorecard-player">${escapeHtml(team.positionLabel)} - ${escapeHtml(team.name)}</td>
            ${holeCells}
            <td class="scorecard-total">${formatToPar(team.toPar)}</td>
          </tr>
        `;
      }).join("");

      scorecardTableWrapEl.innerHTML = `
        <table class="scorecard-table">
          <thead>
            <tr>
              <th class="scorecard-player"></th>
              ${headerCells}
              <th class="scorecard-total">Total</th>
            </tr>
          </thead>
          <tbody>
            ${rows || `<tr><td class="scorecard-player">Add teams in the control panel.</td><td colspan="${holeCount + 1}"></td></tr>`}
          </tbody>
        </table>
      `;
    }

    function renderCompactBox(event, standings, completedThrough, label) {
      tickerEl.classList.add("hidden");
      compactBoxEl.classList.remove("hidden");

      boxTitleEl.textContent = event.name || "Peltola Open";
      boxSubtitleEl.textContent = label;

      const rows = standings.slice(0, maxRows);
      scoreRowsEl.outerHTML = `<div id="scoreRows">${rows.length
        ? rows.map(team => `
          <div class="score-row">
            <div class="team-name">${escapeHtml(team.positionLabel)} - ${escapeHtml(team.name)}</div>
            <div class="score">${completedThrough ? formatToPar(team.toPar) : "--"}</div>
          </div>
        `).join("")
        : `<div class="empty">Add teams in the control panel.</div>`}</div>`;
      scoreRowsEl = document.getElementById("scoreRows");
    }

    function renderTicker(event, standings, completedThrough, label) {
      compactBoxEl.classList.add("hidden");
      tickerEl.classList.remove("hidden");

      tickerInfoEl.textContent = completedThrough ? `Through ${completedThrough}` : "Before round";

      const content = standings.length
        ? standings.map(team => `
          <span class="ticker-item">
            <span class="ticker-team">${escapeHtml(team.positionLabel)} - ${escapeHtml(team.name)}</span>
            <span class="ticker-score">${completedThrough ? formatToPar(team.toPar) : "--"}</span>
          </span>
        `).join("")
        : `<span class="ticker-item"><span class="ticker-team">Add teams in the control panel</span></span>`;

      tickerTrackEl.innerHTML = Array.from({ length: 4 }, (_, index) => `
        <div class="ticker-copy" ${index ? 'aria-hidden="true"' : ''}>${content}<span class="ticker-separator" aria-hidden="true"></span></div>
      `).join("");

      const oldDurationSeconds = Math.max(26, Math.min(70, standings.length * 5 + 18));
      const fasterDurationSeconds = oldDurationSeconds / 1.25;
      tickerTrackEl.style.setProperty("--ticker-duration", `${fasterDurationSeconds}s`);
    }

    function getCompletedThrough(event) {
      const teams = Object.values(event.teams || {});
      if (!teams.length) return 0;

      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      let completedThrough = 0;

      for (let hole = 1; hole <= holeCount; hole += 1) {
        const holeKey = String(hole);
        const everyTeamHasScore = teams.every(team => {
          const score = Number(team.scores?.[holeKey]);
          return Number.isFinite(score) && score > 0;
        });
        if (!everyTeamHasScore) break;
        completedThrough = hole;
      }
      return completedThrough;
    }

    function calculateStandings(event, completedThrough) {
      const holes = event.holes || {};
      const teams = event.teams || {};

      return Object.entries(teams).map(([teamId, team], index) => {
        let strokes = 0;
        let par = 0;

        for (let hole = 1; hole <= completedThrough; hole += 1) {
          const holeKey = String(hole);
          const score = Number(team.scores?.[holeKey]);
          const holePar = Number(holes[holeKey]?.par || 0);
          if (Number.isFinite(score) && score > 0) {
            strokes += score;
            par += holePar;
          }
        }

        return {
          id: teamId,
          name: team.name || `Team ${index + 1}`,
          order: Number(team.order || index + 1),
          strokes,
          par,
          toPar: strokes - par
        };
      }).sort((a, b) => {
        if (!completedThrough) return a.order - b.order || a.name.localeCompare(b.name);
        return a.toPar - b.toPar || a.strokes - b.strokes || a.order - b.order || a.name.localeCompare(b.name);
      });
    }


    function assignPositions(standings) {
      let previousKey = null;
      let previousRank = 0;
      return standings.map((team, index) => {
        const key = `${team.toPar}|${team.strokes}`;
        const rank = previousKey !== null && key === previousKey ? previousRank : index + 1;
        previousKey = key;
        previousRank = rank;
        return {
          ...team,
          rank,
          positionLabel: formatOrdinal(rank)
        };
      });
    }

    function formatPlayedLabel(completedThrough) {
      if (!completedThrough) return "Before round";
      if (completedThrough === 1) return "Through 1 hole";
      return `Through ${completedThrough} holes`;
    }


    function formatOrdinal(value) {
      const v = Math.abs(Number(value));
      const mod100 = v % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${v}th`;
      switch (v % 10) {
        case 1: return `${v}st`;
        case 2: return `${v}nd`;
        case 3: return `${v}rd`;
        default: return `${v}th`;
      }
    }


    function renderScorecardHoleCell(score, par, colorMode) {
      const relative = score - par;
      const className = getScorecardMarkClass(relative);
      if (!className) return `<td class="scorecard-hole">${score}</td>`;
      if (colorMode === "cell") {
        return `<td class="scorecard-hole scorecard-cell-fill ${className}">${score}</td>`;
      }
      return `<td class="scorecard-hole"><span class="scorecard-mark ${className}">${score}</span></td>`;
    }

    function getScorecardColorMode(event) {
      return event.scorecardColorMode === "cell" ? "cell" : "circle";
    }

    function getScorecardMarkClass(relative) {
      if (relative <= -2) return "scorecard-mark-albatross";
      if (relative === -1) return "scorecard-mark-birdie";
      if (relative === 1) return "scorecard-mark-bogey";
      if (relative === 2) return "scorecard-mark-double";
      if (relative === 3) return "scorecard-mark-triple";
      if (relative >= 4) return "scorecard-mark-quad";
      return "";
    }

    function formatToPar(value) {
      if (value === 0) return "E";
      return value > 0 ? `+${value}` : String(value);
    }

    function clampInt(value, min, max) {
      const number = Number.parseInt(value, 10);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function clampNumber(value, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }
  </script>
</body>
</html>
