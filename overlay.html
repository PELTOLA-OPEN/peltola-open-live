<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peltola Open Overlay</title>
  <style>
    :root {
      --panel: rgba(0, 0, 0, 0.5);
      --panel-strong: rgba(0, 0, 0, 0.5);
      --ticker-panel: rgba(0, 0, 0, 0.5);
      --ticker-panel-strong: rgba(0, 0, 0, 0.58);
      --ticker-info-panel: rgba(0, 0, 0, 0.58);
      --ticker-text: #ffffff;
      --ticker-muted: rgba(255, 255, 255, 0.72);
      --ticker-line: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --line-subtle: rgba(255, 255, 255, 0.08);
      --popup-border: rgba(255, 255, 255, 0.72);
      --table-grid: rgba(255, 255, 255, 0.46);
      --table-head-bg: rgba(255, 255, 255, 0.1);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.debug {
      background: linear-gradient(135deg, #295b41, #1b2838);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      color: var(--text);
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .hidden { display: none !important; }

    .compact-box {
      position: absolute;
      right: 3.5vw;
      bottom: 4.5vh;
      display: inline-block;
      width: max-content;
      max-width: min(520px, 44vw);
      padding: 12px 14px 11px;
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(2px);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
      transform: scale(var(--overlay-page-scale, 1));
      transform-origin: bottom right;
    }

    .box-title {
      max-width: 100%;
      overflow: hidden;
      font-size: calc(clamp(12px, 1.05vw, 16px) * var(--overlay-page-scale, 1));
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .box-subtitle {
      margin-top: 1px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: calc(clamp(10px, 0.9vw, 13px) * var(--overlay-page-scale, 1));
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .score-table {
      display: grid;
      grid-template-columns: max-content max-content;
      column-gap: 12px;
      row-gap: 0;
      align-items: center;
    }

    .table-head,
    #scoreRows { display: contents; }

    .table-head div {
      padding-bottom: 5px;
      color: var(--muted);
      font-size: calc(clamp(9px, 0.8vw, 11px) * var(--overlay-page-scale, 1));
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-row { display: contents; }

    .team-name,
    .score {
      padding: 4px 0;
      border-top: 1px solid var(--line-subtle);
      font-size: calc(clamp(13px, 1.25vw, 18px) * var(--overlay-page-scale, 1));
      line-height: 1.12;
    }

    .team-name {
      max-width: min(370px, 34vw);
      overflow: hidden;
      font-weight: 850;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .score {
      min-width: 34px;
      font-weight: 950;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      color: var(--muted);
      font-size: calc(clamp(13px, 1.2vw, 18px) * var(--overlay-page-scale, 1));
      font-weight: 750;
    }

    .ticker {
      position: absolute;
      left: calc(3vw + var(--ticker-offset-x, 0px));
      right: calc(3vw - var(--ticker-offset-x, 0px));
      bottom: calc(4vh + var(--ticker-offset-y, 0px));
      height: var(--ticker-height, clamp(42px, 4.8vw, 58px));
      display: flex;
      overflow: hidden;
      border-radius: 16px;
      background: var(--ticker-panel);
      color: var(--ticker-text);
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      height: 100%;
      animation: ticker-scroll var(--ticker-duration, 27.2s) linear infinite;
      will-change: transform;
    }

    .ticker-copy {
      display: flex;
      align-items: center;
      gap: 34px;
      padding: 0 17px;
      white-space: nowrap;
    }

    .ticker-item {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      font-size: calc(clamp(15px, 1.6vw, 23px) * var(--overlay-page-scale, 1) * var(--ticker-font-scale, 1));
      line-height: 1;
    }

    .ticker-team { font-weight: 850; }

    .ticker-score {
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .ticker-separator {
      align-self: stretch;
      width: 30px;
      margin: 0;
      background: var(--ticker-panel-strong);
      border-radius: 0;
      opacity: 1;
    }

    .ticker-info {
      display: grid;
      place-items: center;
      min-width: clamp(104px, 10vw, 150px);
      padding: 0 12px;
      border-right: 1px solid var(--ticker-line);
      background: var(--ticker-info-panel);
      font-size: calc(clamp(11px, 1vw, 15px) * var(--overlay-page-scale, 1) * var(--ticker-font-scale, 1));
      font-weight: 950;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .helsinki-clock {
      position: absolute;
      left: calc(3vw + var(--ticker-offset-x, 0px));
      bottom: calc(4vh + var(--ticker-height, 58px) + 8px + var(--ticker-offset-y, 0px));
      min-width: clamp(104px, 10vw, 150px);
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--ticker-panel);
      color: var(--ticker-text);
      font-size: calc(clamp(12px, 1.1vw, 17px) * var(--overlay-page-scale, 1) * var(--ticker-font-scale, 1));
      font-weight: 950;
      letter-spacing: 0.06em;
      line-height: 1;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    .ticker-logo {
      position: absolute;
      left: calc(3vw + var(--logo-base-offset-x, 132px) + var(--logo-offset-x, 0px));
      bottom: calc(4vh + var(--ticker-height, 58px) + 8px + var(--logo-offset-y, 0px));
      width: var(--ticker-logo-size, 72px);
      height: var(--ticker-logo-size, 72px);
      display: grid;
      place-items: center;
      transform-origin: left bottom;
    }

    .ticker-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: none;
    }

    .ticker-logo.logo-rotating img {
      animation: logo-clockwise-spin var(--logo-rotation-duration, 6s) linear infinite;
    }

    @keyframes logo-clockwise-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .scorecard-pop {
      position: absolute;
      left: var(--scorecard-center-x, 50%);
      top: var(--scorecard-center-y, 43%);
      width: auto;
      max-width: 96vw;
      max-height: 74vh;
      transform: translate(-50%, -50%) translateY(24px) scale(var(--scorecard-hidden-scale, 0.96)) scaleX(var(--scorecard-width-factor, 1)) scaleY(var(--scorecard-height-factor, 1));
      transform-origin: center center;
      opacity: 0;
      padding: var(--scorecard-popup-padding, 12px);
      border: 2px solid var(--popup-border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .scorecard-pop.show {
      transform: translate(-50%, -50%) translateY(0) scale(var(--scorecard-show-scale, 1)) scaleX(var(--scorecard-width-factor, 1)) scaleY(var(--scorecard-height-factor, 1));
      opacity: 1;
    }

    .odds-pop {
      position: absolute;
      left: var(--odds-center-x, 50%);
      top: var(--odds-center-y, 38%);
      display: inline-block;
      width: max-content;
      max-width: 94vw;
      max-height: 76vh;
      transform: translate(-50%, -50%) translateY(24px) scale(var(--odds-hidden-scale, 0.96)) scaleX(var(--odds-width-factor, 1)) scaleY(var(--odds-height-factor, 1));
      transform-origin: center center;
      opacity: 0;
      padding: var(--odds-padding, 16px);
      border: 2px solid var(--popup-border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .odds-pop.show {
      transform: translate(-50%, -50%) translateY(0) scale(var(--odds-show-scale, 1)) scaleX(var(--odds-width-factor, 1)) scaleY(var(--odds-height-factor, 1));
      opacity: 1;
    }

    .odds-header {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .odds-title {
      overflow: hidden;
      font-size: calc(clamp(17px, 2vw, 30px) * var(--odds-header-font-scale, var(--odds-font-scale, 1)));
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .odds-subtitle {
      display: none;
    }

    .odds-table-wrap {
      display: inline-block;
      overflow: hidden;
      width: var(--odds-table-width, max-content);
      max-width: calc(94vw - 32px);
    }

    .odds-pop-table {
      width: var(--odds-table-width, auto);
      border-collapse: collapse;
      table-layout: fixed;
      color: white;
      font-variant-numeric: tabular-nums;
      --odds-grid: var(--table-grid);
    }

    .odds-pop-table th,
    .odds-pop-table td {
      height: var(--odds-cell-height, clamp(28px, 2.6vw, 39px));
      border: 1px solid var(--odds-grid);
      padding: calc(var(--odds-cell-padding, 3px) * 0.55) var(--odds-cell-padding, 3px);
      vertical-align: middle;
      line-height: 1;
      background-clip: padding-box;
      white-space: nowrap;
    }

    .odds-pop-table th {
      background: var(--table-head-bg);
      font-size: calc(clamp(10px, 0.9vw, 14px) * var(--odds-header-font-scale, var(--odds-font-scale, 1)));
      font-weight: 950;
      text-transform: uppercase;
    }

    .odds-pop-table td {
      font-size: calc(clamp(12px, 1.2vw, 19px) * var(--odds-font-scale, 1));
      font-weight: 850;
    }

    .odds-pos-cell {
      width: var(--odds-pos-width, 32px);
      min-width: var(--odds-pos-width, 32px);
      text-align: center;
      font-weight: 950 !important;
    }

    .odds-team-cell {
      width: var(--odds-team-width, auto);
      min-width: var(--odds-team-width, auto);
      max-width: var(--odds-team-width, var(--odds-team-max, min(260px, 32vw)));
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .odds-value-cell {
      width: var(--odds-value-width, 54px);
      min-width: var(--odds-value-width, 54px);
      text-align: right;
      font-weight: 950 !important;
    }


    .pickem-pop {
      position: absolute;
      left: var(--pickem-center-x, 50%);
      top: var(--pickem-center-y, 42%);
      display: inline-block;
      width: max-content;
      max-width: 94vw;
      max-height: 76vh;
      transform: translate(-50%, -50%) translateY(24px) scale(var(--pickem-hidden-scale, 0.96)) scaleX(var(--pickem-width-factor, 1)) scaleY(var(--pickem-height-factor, 1));
      transform-origin: center center;
      opacity: 0;
      padding: var(--pickem-padding, 16px);
      border: 2px solid var(--popup-border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .pickem-pop.show {
      transform: translate(-50%, -50%) translateY(0) scale(var(--pickem-show-scale, 1)) scaleX(var(--pickem-width-factor, 1)) scaleY(var(--pickem-height-factor, 1));
      opacity: 1;
    }

    .pickem-header {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .pickem-title {
      overflow: hidden;
      font-size: calc(clamp(17px, 2vw, 30px) * var(--pickem-header-font-scale, var(--pickem-font-scale, 1)));
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pickem-table-wrap {
      display: inline-block;
      overflow: hidden;
      width: var(--pickem-table-width, max-content);
      max-width: calc(94vw - 32px);
    }

    .pickem-pop-table {
      width: var(--pickem-table-width, auto);
      border-collapse: collapse;
      table-layout: fixed;
      color: white;
      font-variant-numeric: tabular-nums;
      --pickem-grid: var(--table-grid);
    }

    .pickem-pop-table th,
    .pickem-pop-table td {
      height: var(--pickem-cell-height, clamp(28px, 2.6vw, 39px));
      border: 1px solid var(--pickem-grid);
      padding: calc(var(--pickem-cell-padding, 3px) * 0.55) var(--pickem-cell-padding, 3px);
      vertical-align: middle;
      line-height: 1;
      background-clip: padding-box;
      white-space: nowrap;
    }

    .pickem-pop-table th {
      background: var(--table-head-bg);
      font-size: calc(clamp(10px, 0.9vw, 14px) * var(--pickem-header-font-scale, var(--pickem-font-scale, 1)));
      font-weight: 950;
      text-transform: uppercase;
    }

    .pickem-pop-table td {
      font-size: calc(clamp(12px, 1.2vw, 19px) * var(--pickem-font-scale, 1));
      font-weight: 850;
    }

    .pickem-pos-cell {
      width: var(--pickem-pos-width, 32px);
      min-width: var(--pickem-pos-width, 32px);
      text-align: center;
      font-weight: 950 !important;
    }

    .pickem-name-cell {
      width: var(--pickem-name-width, auto);
      min-width: var(--pickem-name-width, auto);
      max-width: var(--pickem-name-width, var(--pickem-name-max, min(260px, 32vw)));
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pickem-score-cell {
      width: var(--pickem-score-width, 54px);
      min-width: var(--pickem-score-width, 54px);
      text-align: right;
      font-weight: 950 !important;
    }

    .scorecard-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .scorecard-title {
      overflow: hidden;
      font-size: calc(clamp(17px, 2vw, 30px) * var(--scorecard-header-font-scale, var(--scorecard-font-scale, 1)));
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scorecard-through {
      flex: none;
      color: var(--muted);
      font-size: calc(clamp(12px, 1.15vw, 18px) * var(--scorecard-header-font-scale, var(--scorecard-font-scale, 1)));
      font-weight: 950;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .scorecard-table-wrap {
      overflow: hidden;
      width: max-content;
      max-width: 100%;
    }

    .scorecard-table {
      width: auto;
      border-collapse: collapse;
      table-layout: fixed;
      color: white;
      font-variant-numeric: tabular-nums;
      --scorecard-grid: var(--table-grid);
    }

    .scorecard-table th,
    .scorecard-table td {
      height: var(--scorecard-cell-height, clamp(24px, 2.45vw, 35px));
      border: 1px solid var(--scorecard-grid);
      padding: calc(var(--scorecard-cell-padding, 3px) * 0.35) var(--scorecard-cell-padding, 3px);
      text-align: center;
      vertical-align: middle;
      line-height: 1;
      background-clip: padding-box;
    }

    .scorecard-table th {
      background: var(--table-head-bg);
      font-size: calc(clamp(10px, 0.9vw, 14px) * var(--scorecard-header-font-scale, var(--scorecard-font-scale, 1)));
      font-weight: 950;
      text-transform: uppercase;
    }

    .scorecard-table td {
      font-size: calc(clamp(11px, 1.1vw, 18px) * var(--scorecard-font-scale, 1));
      font-weight: 850;
      line-height: 1;
    }

    .scorecard-player {
      width: var(--scorecard-player-width, 150px);
      min-width: var(--scorecard-player-width, 150px);
      max-width: var(--scorecard-player-width, 150px);
      text-align: left !important;
      padding-left: 7px !important;
      padding-right: 7px !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scorecard-hole {
      width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      min-width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      max-width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      text-align: center !important;
      vertical-align: middle !important;
      overflow: hidden;
    }

    .scorecard-total {
      width: var(--scorecard-total-width, clamp(42px, 4.2vw, 66px));
      min-width: var(--scorecard-total-width, clamp(42px, 4.2vw, 66px));
      font-weight: 950 !important;
    }

    .scorecard-mark {
      display: inline-grid;
      place-items: center;
      width: clamp(18px, 1.75vw, 28px);
      height: clamp(18px, 1.75vw, 28px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 50%;
      color: #ffffff;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .scorecard-cell-fill {
      font-weight: 950 !important;
    }

    .scorecard-mark-albatross { background: #245f9e; }
    .scorecard-mark-birdie { background: #6db7f2; }
    .scorecard-mark-bogey { background: #e3a17d; color: #111111; }
    .scorecard-mark-double { background: #d86431; color: #111111; }
    .scorecard-mark-triple { background: #d00000; color: #111111; }
    .scorecard-mark-quad { background: #aa0000; color: #111111; }

    .scorecard-empty-cell {
      color: rgba(255, 255, 255, 0.28);
    }



    .ad-pop {
      position: absolute;
      left: var(--ad-center-x, 50%);
      top: var(--ad-center-y, 50%);
      width: auto;
      max-width: 90vw;
      max-height: 90vh;
      transform: translate(-50%, -50%) rotate(0deg) scale(var(--ad-show-scale, 1)) scaleX(var(--ad-width-factor, 1)) scaleY(var(--ad-height-factor, 1));
      transform-origin: center center;
      opacity: 0;
      background: transparent;
    }

    .ad-pop.show {
      opacity: 1;
      animation: ad-boomerang-in 2000ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .ad-pop.exiting {
      opacity: 0;
      animation: ad-boomerang-out 850ms cubic-bezier(0.5, 0, 0.75, 0) both;
    }

    .ad-pop img {
      display: block;
      width: var(--ad-base-width, min(55vw, 1000px));
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      filter: none;
      transform-origin: center center;
    }

    .ad-pop.show img {
      animation: ad-pulse 1400ms ease-in-out 2000ms infinite;
    }

    .ad-pop.exiting img {
      animation: none;
    }

    @keyframes ad-pulse {
      0%, 100% { transform: scale(0.965); }
      50% { transform: scale(1.07); }
    }

    @keyframes ad-boomerang-in {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-540deg) scale(calc(var(--ad-show-scale, 1) * 0.08)) scaleX(var(--ad-width-factor, 1)) scaleY(var(--ad-height-factor, 1));
      }
      68% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(18deg) scale(calc(var(--ad-show-scale, 1) * 1.08)) scaleX(var(--ad-width-factor, 1)) scaleY(var(--ad-height-factor, 1));
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(var(--ad-show-scale, 1)) scaleX(var(--ad-width-factor, 1)) scaleY(var(--ad-height-factor, 1));
      }
    }

    @keyframes ad-boomerang-out {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(var(--ad-show-scale, 1)) scaleX(var(--ad-width-factor, 1)) scaleY(var(--ad-height-factor, 1));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + 120vw), -50%) rotate(720deg) scale(calc(var(--ad-show-scale, 1) * 0.35)) scaleX(var(--ad-width-factor, 1)) scaleY(var(--ad-height-factor, 1));
      }
    }

    @media (max-width: 760px) {
      body.debug {
        background: #102018;
      }

      .compact-box {
        right: 12px;
        bottom: 16px;
        max-width: calc(100vw - 24px);
      }

      .ticker {
        left: calc(8px + var(--ticker-offset-x, 0px));
        right: calc(8px - var(--ticker-offset-x, 0px));
        bottom: calc(12px + var(--ticker-offset-y, 0px));
        height: var(--ticker-height, 44px);
        border-radius: 12px;
      }

      .ticker-info {
        min-width: calc(84px * var(--overlay-page-scale, 1));
        padding: 0 calc(8px * var(--overlay-page-scale, 1));
        font-size: calc(10px * var(--overlay-page-scale, 1));
      }

      .helsinki-clock {
        left: calc(8px + var(--ticker-offset-x, 0px));
        bottom: calc(12px + var(--ticker-height, 44px) + 6px + var(--ticker-offset-y, 0px));
        min-width: calc(84px * var(--overlay-page-scale, 1));
        padding: calc(7px * var(--overlay-page-scale, 1)) calc(8px * var(--overlay-page-scale, 1));
        border-radius: 10px;
        font-size: calc(11px * var(--overlay-page-scale, 1));
      }

      .ticker-logo {
        left: calc(8px + var(--logo-base-offset-x, 118px) + var(--logo-offset-x, 0px));
        bottom: calc(12px + var(--ticker-height, 44px) + 6px + var(--logo-offset-y, 0px));
      }

      .ticker-copy {
        gap: calc(24px * var(--overlay-page-scale, 1));
        padding: 0 calc(12px * var(--overlay-page-scale, 1));
      }

      .ticker-item {
        font-size: calc(14px * var(--overlay-page-scale, 1) * var(--ticker-font-scale, 1));
      }

      .scorecard-pop {
        left: var(--scorecard-center-x, 50%);
        top: var(--scorecard-center-y, 43%);
        width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 76px);
        padding: 10px;
        border-radius: 12px;
      }

      .scorecard-table-wrap {
        width: 100%;
      }

      .scorecard-title {
        font-size: calc(16px * var(--scorecard-header-font-scale, var(--scorecard-font-scale, 1)));
      }

      .scorecard-through {
        font-size: calc(11px * var(--scorecard-header-font-scale, var(--scorecard-font-scale, 1)));
      }

      .scorecard-table th,
      .scorecard-table td {
        height: 22px;
        padding: 1px 2px;
      }

      .scorecard-table th {
        font-size: 9px;
      }

      .scorecard-table td {
        font-size: 10px;
      }

      .scorecard-player {
        max-width: var(--scorecard-player-width, var(--scorecard-player-mobile-max, 116px));
        padding-left: 4px !important;
        padding-right: 4px !important;
      }

      .scorecard-hole {
        width: var(--scorecard-hole-mobile-width, 20px);
        min-width: var(--scorecard-hole-mobile-width, 20px);
        max-width: var(--scorecard-hole-mobile-width, 20px);
      }

      .scorecard-mark {
        width: 14px;
        min-width: 14px;
        max-width: 14px;
        height: 14px;
        min-height: 14px;
        max-height: 14px;
        font-size: 9px;
      }

      .scorecard-total {
        width: var(--scorecard-total-mobile-width, 38px);
      }

      .scorecard-mark {
        width: 16px;
        height: 16px;
      }
      .odds-pop {
        left: var(--odds-center-x, 50%);
        top: var(--odds-center-y, 38%);
        width: max-content;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 76px);
        padding: 10px;
        border-radius: 12px;
      }

      .odds-table-wrap {
        max-width: calc(100vw - 36px);
      }

      .odds-title { font-size: calc(15px * var(--odds-header-font-scale, var(--odds-font-scale, 1))); }
      .odds-pop-table th,
      .odds-pop-table td {
        height: 25px;
        padding: 2px 4px;
      }
      .odds-pop-table th { font-size: calc(9px * var(--odds-header-font-scale, var(--odds-font-scale, 1))); }
      .odds-pop-table td { font-size: 11px; }
      .odds-team-cell {
        width: var(--odds-team-width, auto);
        min-width: var(--odds-team-width, auto);
        max-width: var(--odds-team-width, var(--odds-team-mobile-max, 136px));
      }
      .odds-pos-cell { min-width: var(--odds-pos-width, 28px); }
      .odds-value-cell { min-width: var(--odds-value-width, 46px); }
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-25%); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section id="compactBox" class="compact-box hidden" aria-live="polite">
      <div id="boxTitle" class="box-title">Peltola Open</div>
      <div id="boxSubtitle" class="box-subtitle">Before round</div>
      <div id="scoreTable" class="score-table">
        <div class="table-head">
          <div>Team</div>
          <div class="score">Score</div>
        </div>
        <div id="scoreRows"></div>
      </div>
    </section>

    <section id="ticker" class="ticker hidden" aria-live="polite">
      <div id="tickerInfo" class="ticker-info">Before round</div>
      <div class="ticker-viewport">
        <div id="tickerTrack" class="ticker-track"></div>
      </div>
    </section>

    <div id="helsinkiClock" class="helsinki-clock hidden" aria-live="off">--:--:--</div>
    <div id="tickerLogo" class="ticker-logo hidden" aria-live="off"><img id="tickerLogoImg" src="peltola-logo-round.png" alt="Peltola Open logo" /></div>

    <section id="scorecardPop" class="scorecard-pop hidden" aria-live="polite">
      <div class="scorecard-header">
        <div id="scorecardTitle" class="scorecard-title">Peltola Open</div>
        <div id="scorecardThrough" class="scorecard-through">Through 1</div>
      </div>
      <div id="scorecardTableWrap" class="scorecard-table-wrap"></div>
    </section>
    <section id="oddsPop" class="odds-pop hidden" aria-live="polite">
      <div class="odds-header">
        <div id="oddsTitle" class="odds-title">Live odds</div>
        <div id="oddsSubtitle" class="odds-subtitle">Before round</div>
      </div>
      <div id="oddsTableWrap" class="odds-table-wrap"></div>
    </section>

    <section id="pickemPop" class="pickem-pop hidden" aria-live="polite">
      <div class="pickem-header">
        <div id="pickemTitle" class="pickem-title">Pickem standings</div>
      </div>
      <div id="pickemTableWrap" class="pickem-table-wrap"></div>
    </section>

    <section id="adPop" class="ad-pop hidden" aria-live="polite">
      <img src="peltola-ad.png" alt="Peltola Open ad" />
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const params = new URLSearchParams(location.search);
    const eventId = params.get("event") || "2026";
    const maxRows = Number(params.get("rows") || 12);
    const forcedMode = params.get("mode");

    if (params.get("debug") === "1") document.body.classList.add("debug");

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const compactBoxEl = document.getElementById("compactBox");
    const boxTitleEl = document.getElementById("boxTitle");
    const boxSubtitleEl = document.getElementById("boxSubtitle");
    const scoreTableEl = document.getElementById("scoreTable");
    let scoreRowsEl = document.getElementById("scoreRows");
    const tickerEl = document.getElementById("ticker");
    const tickerTrackEl = document.getElementById("tickerTrack");
    const tickerInfoEl = document.getElementById("tickerInfo");
    const scorecardPopEl = document.getElementById("scorecardPop");
    const scorecardTitleEl = document.getElementById("scorecardTitle");
    const scorecardThroughEl = document.getElementById("scorecardThrough");
    const scorecardTableWrapEl = document.getElementById("scorecardTableWrap");
    const oddsPopEl = document.getElementById("oddsPop");
    const oddsTitleEl = document.getElementById("oddsTitle");
    const oddsSubtitleEl = document.getElementById("oddsSubtitle");
    const oddsTableWrapEl = document.getElementById("oddsTableWrap");
    const pickemPopEl = document.getElementById("pickemPop");
    const pickemTitleEl = document.getElementById("pickemTitle");
    const pickemTableWrapEl = document.getElementById("pickemTableWrap");
    const helsinkiClockEl = document.getElementById("helsinkiClock");
    const tickerLogoEl = document.getElementById("tickerLogo");
    const tickerLogoImgEl = document.getElementById("tickerLogoImg");
    const adPopEl = document.getElementById("adPop");

    let lastFlashSequence = null;
    let scorecardHideTimer = null;
    let oddsHideTimer = null;
    let pickemHideTimer = null;
    let adHideTimer = null;
    let scorecardPreviewActive = false;
    let oddsPreviewActive = false;
    let pickemPreviewActive = false;
    let adPreviewActive = false;
    let flashActive = false;
    let oddsFlashActive = false;
    let pickemFlashActive = false;
    let adFlashActive = false;
    let lastOddsFlashSequence = null;
    let lastPickemFlashSequence = null;
    let lastAdFlashSequence = null;
    let clockTimer = null;
    let latestEvent = null;
    let firebaseLoaded = false;
    let firebaseError = null;

    onValue(
      ref(db, `events/${eventId}`),
      snapshot => {
        firebaseLoaded = true;
        firebaseError = null;
        latestEvent = snapshot.val();
        renderOverlay();
      },
      error => {
        firebaseLoaded = true;
        firebaseError = error;
        latestEvent = null;
        console.error(error);
        renderOverlay();
      }
    );

    function renderOverlay() {
      if (firebaseError || !firebaseLoaded || !isPlainObject(latestEvent) || latestEvent.showStandings === false) {
        hideAllOverlay();
        return;
      }

      const event = latestEvent;

      applyOverlayLayout(event);
      updateClockVisibility(event);
      const mode = forcedMode || event.overlayMode || "compact";
      const completedThrough = getCompletedThrough(event);
      const label = formatPlayedLabel(completedThrough);
      const standings = assignPositions(calculateStandings(event, completedThrough));

      if (mode === "ticker") renderTicker(event, standings, completedThrough, label);
      else renderCompactBox(event, standings, completedThrough, label);

      maybeShowScorecardFlash(event);
      maybeShowOddsFlash(event);
      maybeShowPickemFlash(event);
      maybeShowAdFlash(event);
      updateScorecardPreview(event);
      updateOddsPreview(event);
      updatePickemPreview(event);
      updateAdPreview(event);
    }

    function hideAllOverlay() {
      compactBoxEl.classList.add("hidden");
      tickerEl.classList.add("hidden");
      helsinkiClockEl.classList.add("hidden");
      tickerLogoEl.classList.add("hidden");
      if (!scorecardPreviewActive && !flashActive) scorecardPopEl.classList.add("hidden");
      if (!oddsPreviewActive && !oddsFlashActive) oddsPopEl.classList.add("hidden");
      if (!pickemPreviewActive && !pickemFlashActive) pickemPopEl.classList.add("hidden");
      if (!adPreviewActive && !adFlashActive) adPopEl.classList.add("hidden");
      if (clockTimer) {
        window.clearInterval(clockTimer);
        clockTimer = null;
      }
    }

    function isPlainObject(value) {
      return Boolean(value) && typeof value === "object" && !Array.isArray(value);
    }

    function applyOverlayTheme(event) {
      const saved = event?.overlayTheme || {};
      const legacyBackground = saved.backgroundColor || "#000000";
      const legacyLine = saved.lineColor || "#ffffff";
      const legacyText = saved.textColor || "#ffffff";
      const legacyOpacity = saved.overlayOpacity ?? 50;
      const theme = {
        tickerBackgroundColor: saved.tickerBackgroundColor || legacyBackground,
        tickerStrongColor: saved.tickerStrongColor || saved.tickerBackgroundColor || legacyBackground,
        tickerLineColor: saved.tickerLineColor || legacyLine,
        tickerTextColor: saved.tickerTextColor || legacyText,
        tickerOpacity: saved.tickerOpacity ?? legacyOpacity,
        tickerInfoOpacity: saved.tickerInfoOpacity ?? saved.tickerOpacity ?? legacyOpacity,
        popupBackgroundColor: saved.popupBackgroundColor || legacyBackground,
        popupLineColor: saved.popupLineColor || legacyLine,
        popupTextColor: saved.popupTextColor || legacyText,
        popupOpacity: saved.popupOpacity ?? legacyOpacity
      };
      const tickerBackground = hexToRgb(theme.tickerBackgroundColor, { r: 0, g: 0, b: 0 });
      const tickerStrong = hexToRgb(theme.tickerStrongColor, tickerBackground);
      const tickerLine = hexToRgb(theme.tickerLineColor, { r: 255, g: 255, b: 255 });
      const tickerText = hexToRgb(theme.tickerTextColor, { r: 255, g: 255, b: 255 });
      const popupBackground = hexToRgb(theme.popupBackgroundColor, { r: 0, g: 0, b: 0 });
      const popupLine = hexToRgb(theme.popupLineColor, { r: 255, g: 255, b: 255 });
      const popupText = hexToRgb(theme.popupTextColor, { r: 255, g: 255, b: 255 });
      const tickerOpacity = clampNumber(theme.tickerOpacity, 0, 100) / 100;
      const tickerInfoOpacity = clampNumber(theme.tickerInfoOpacity, 0, 100) / 100;
      const popupOpacity = clampNumber(theme.popupOpacity, 0, 100) / 100;

      document.documentElement.style.setProperty("--ticker-panel", rgba(tickerBackground, tickerOpacity));
      document.documentElement.style.setProperty("--ticker-panel-strong", rgba(tickerStrong, tickerOpacity));
      document.documentElement.style.setProperty("--ticker-info-panel", rgba(tickerStrong, tickerInfoOpacity));
      document.documentElement.style.setProperty("--ticker-text", rgb(tickerText));
      document.documentElement.style.setProperty("--ticker-muted", rgba(tickerText, 0.72));
      document.documentElement.style.setProperty("--ticker-line", rgba(tickerLine, 0.20));
      document.documentElement.style.setProperty("--panel", rgba(popupBackground, popupOpacity));
      document.documentElement.style.setProperty("--panel-strong", rgba(popupBackground, Math.min(1, popupOpacity + 0.08)));
      document.documentElement.style.setProperty("--text", rgb(popupText));
      document.documentElement.style.setProperty("--muted", rgba(popupText, 0.72));
      document.documentElement.style.setProperty("--line", rgba(popupLine, 0.16));
      document.documentElement.style.setProperty("--line-subtle", rgba(popupLine, 0.08));
      document.documentElement.style.setProperty("--popup-border", rgba(popupLine, 0.72));
      document.documentElement.style.setProperty("--table-grid", rgba(popupLine, 0.46));
      document.documentElement.style.setProperty("--table-head-bg", rgba(popupLine, 0.10));
    }
    function hexToRgb(value, fallback) {
      const text = String(value || "").trim();
      const match = /^#?([0-9a-fA-F]{6})$/.exec(text);
      if (!match) return fallback;
      const hex = match[1];
      return {
        r: parseInt(hex.slice(0, 2), 16),
        g: parseInt(hex.slice(2, 4), 16),
        b: parseInt(hex.slice(4, 6), 16)
      };
    }

    function rgba(color, alpha) {
      return `rgba(${color.r}, ${color.g}, ${color.b}, ${clampNumber(alpha, 0, 1)})`;
    }

    function rgb(color) {
      return `rgb(${color.r}, ${color.g}, ${color.b})`;
    }

    function applyOverlayLayout(event) {
      applyOverlayTheme(event);
      const layout = {
        overlayPageScale: 100,
        tickerHeightPx: 58,
        tickerFontScale: 100,
        tickerLogoScale: 100,
        logoRotationSeconds: 6,
        logoRotateEnabled: false,
        tickerOffsetX: 0,
        tickerOffsetY: 0,
        logoOffsetX: 0,
        logoOffsetY: 0,
        scorecardCenterX: 50,
        scorecardCenterY: 43,
        scorecardScale: 100,
        scorecardWidthScale: 100,
        scorecardHeightScale: 100,
        scorecardFontScale: 100,
        scorecardHeaderFontScale: 100,
        scorecardRowHeightPx: 28,
        scorecardColumnWidthPx: 24,
        scorecardPaddingPx: 10,
        ...(event.overlayLayout || {})
      };
      const oddsLayout = {
        oddsCenterX: 50,
        oddsCenterY: 38,
        oddsScale: 100,
        oddsWidthScale: 100,
        oddsHeightScale: 100,
        oddsFontScale: 100,
        oddsHeaderFontScale: 100,
        oddsRowHeightPx: 34,
        oddsPaddingPx: 10,
        ...(event.oddsOverlayLayout || {})
      };
      const pickemLayout = {
        pickemCenterX: 50,
        pickemCenterY: 42,
        pickemScale: 100,
        pickemWidthScale: 100,
        pickemHeightScale: 100,
        pickemFontScale: 100,
        pickemHeaderFontScale: 100,
        pickemRowHeightPx: 34,
        pickemPaddingPx: 10,
        ...(event.pickemOverlayLayout || {})
      };
      const adLayout = {
        adCenterX: 50,
        adCenterY: 50,
        adScale: 100,
        adWidthScale: 100,
        adHeightScale: 100,
        ...(event.adOverlayLayout || {})
      };

      const overlayPageScale = clampNumber(layout.overlayPageScale, 30, 200) / 100;
      const tickerHeight = clampNumber(layout.tickerHeightPx, 16, 120) * overlayPageScale;
      const tickerFontScale = clampNumber(layout.tickerFontScale || 100, 50, 200) / 100;
      const tickerLogoScale = clampNumber(layout.tickerLogoScale || 100, 40, 220) / 100;
      const logoRotationSeconds = clampNumber(layout.logoRotationSeconds || 6, 1, 30);
      const logoRotateEnabled = layout.logoRotateEnabled === true;
      const tickerOffsetX = clampNumber(layout.tickerOffsetX || 0, -300, 300);
      const tickerOffsetY = clampNumber(layout.tickerOffsetY || 0, -300, 300);
      const logoOffsetX = clampNumber(layout.logoOffsetX || 0, -600, 600);
      const logoOffsetY = clampNumber(layout.logoOffsetY || 0, -600, 600);
      const centerX = clampNumber(layout.scorecardCenterX, 0, 100);
      const centerY = clampNumber(layout.scorecardCenterY, 0, 100);
      const scale = (clampNumber(layout.scorecardScale, 50, 150) / 100) * overlayPageScale;
      const widthFactor = clampNumber(layout.scorecardWidthScale, 50, 180) / 100;
      const heightFactor = clampNumber(layout.scorecardHeightScale, 50, 180) / 100;
      const scorecardFontScale = clampNumber(layout.scorecardFontScale || 100, 50, 200) / 100;
      const scorecardHeaderFontScale = clampNumber(layout.scorecardHeaderFontScale || 100, 50, 220) / 100;
      const scorecardRowHeight = clampNumber(layout.scorecardRowHeightPx || 28, 14, 80);
      const scorecardColumnWidth = clampNumber(layout.scorecardColumnWidthPx || 24, 14, 80);
      const scorecardPadding = clampNumber(layout.scorecardPaddingPx || 10, 0, 40);
      const scorecardCellPadding = Math.max(1, Math.min(20, scorecardPadding / 3));
      const oddsCenterX = clampNumber(oddsLayout.oddsCenterX, 0, 100);
      const oddsCenterY = clampNumber(oddsLayout.oddsCenterY, 0, 100);
      const oddsScale = (clampNumber(oddsLayout.oddsScale, 50, 150) / 100) * overlayPageScale;
      const oddsWidthFactor = clampNumber(oddsLayout.oddsWidthScale, 50, 180) / 100;
      const oddsHeightFactor = clampNumber(oddsLayout.oddsHeightScale, 50, 180) / 100;
      const oddsFontScaleControl = clampNumber(oddsLayout.oddsFontScale || 100, 50, 200) / 100;
      const oddsHeaderFontScaleControl = clampNumber(oddsLayout.oddsHeaderFontScale || 100, 50, 220) / 100;
      const oddsRowHeight = clampNumber(oddsLayout.oddsRowHeightPx || 34, 16, 90);
      const oddsPadding = clampNumber(oddsLayout.oddsPaddingPx || 10, 0, 40);
      const oddsCellPadding = Math.max(1, Math.min(20, oddsPadding / 2));
      const pickemCenterX = clampNumber(pickemLayout.pickemCenterX, 0, 100);
      const pickemCenterY = clampNumber(pickemLayout.pickemCenterY, 0, 100);
      const pickemScale = (clampNumber(pickemLayout.pickemScale, 50, 150) / 100) * overlayPageScale;
      const pickemWidthFactor = clampNumber(pickemLayout.pickemWidthScale, 50, 180) / 100;
      const pickemHeightFactor = clampNumber(pickemLayout.pickemHeightScale, 50, 180) / 100;
      const pickemFontScaleControl = clampNumber(pickemLayout.pickemFontScale || 100, 50, 200) / 100;
      const pickemHeaderFontScaleControl = clampNumber(pickemLayout.pickemHeaderFontScale || 100, 50, 220) / 100;
      const pickemRowHeight = clampNumber(pickemLayout.pickemRowHeightPx || 34, 16, 90);
      const pickemPadding = clampNumber(pickemLayout.pickemPaddingPx || 10, 0, 40);
      const pickemCellPadding = Math.max(1, Math.min(20, pickemPadding / 2));
      const adCenterX = clampNumber(adLayout.adCenterX, 0, 100);
      const adCenterY = clampNumber(adLayout.adCenterY, 0, 100);
      const adScale = (clampNumber(adLayout.adScale, 20, 200) / 100) * overlayPageScale;
      const adWidthFactor = clampNumber(adLayout.adWidthScale, 50, 200) / 100;
      const adHeightFactor = clampNumber(adLayout.adHeightScale, 50, 200) / 100;
      const viewportWidth = Math.max(320, window.innerWidth || 1920);
      const baseHoleWidth = scorecardColumnWidth;
      const baseTotalWidth = Math.max(38, Math.round(scorecardColumnWidth * 1.65));
      const basePlayerMax = Math.min(360, viewportWidth * 0.31);
      const baseCellHeight = scorecardRowHeight;
      const mobileBaseHoleWidth = scorecardColumnWidth;
      const mobileBaseTotalWidth = Math.max(36, Math.round(scorecardColumnWidth * 1.55));
      const mobileBasePlayerMax = 116;
      const baseLogoSize = Math.max(64, Math.min(104, viewportWidth * 0.08)) * overlayPageScale * tickerLogoScale;

      document.documentElement.style.setProperty("--overlay-page-scale", String(overlayPageScale));
      document.documentElement.style.setProperty("--ticker-height", `${tickerHeight}px`);
      document.documentElement.style.setProperty("--ticker-font-scale", String(tickerFontScale));
      document.documentElement.style.setProperty("--ticker-logo-size", `${baseLogoSize}px`);
      document.documentElement.style.setProperty("--logo-rotation-duration", `${logoRotationSeconds}s`);
      tickerLogoEl.classList.toggle("logo-rotating", logoRotateEnabled);
      document.documentElement.style.setProperty("--ticker-offset-x", `${tickerOffsetX}px`);
      document.documentElement.style.setProperty("--ticker-offset-y", `${tickerOffsetY}px`);
      document.documentElement.style.setProperty("--logo-offset-x", `${logoOffsetX}px`);
      document.documentElement.style.setProperty("--logo-offset-y", `${logoOffsetY}px`);
      document.documentElement.style.setProperty("--scorecard-center-x", `${centerX}%`);
      document.documentElement.style.setProperty("--scorecard-center-y", `${centerY}%`);
      document.documentElement.style.setProperty("--scorecard-show-scale", String(scale));
      document.documentElement.style.setProperty("--scorecard-hidden-scale", String(scale * 0.96));
      document.documentElement.style.setProperty("--scorecard-width-factor", String(widthFactor));
      document.documentElement.style.setProperty("--scorecard-height-factor", String(heightFactor));
      document.documentElement.style.setProperty("--scorecard-font-scale", String(scorecardFontScale));
      document.documentElement.style.setProperty("--scorecard-header-font-scale", String(scorecardHeaderFontScale));
      document.documentElement.style.setProperty("--scorecard-popup-padding", `${scorecardPadding}px`);
      document.documentElement.style.setProperty("--scorecard-cell-padding", `${scorecardCellPadding}px`);
      document.documentElement.style.setProperty("--scorecard-hole-width", `${baseHoleWidth}px`);
      document.documentElement.style.setProperty("--scorecard-total-width", `${baseTotalWidth}px`);
      document.documentElement.style.setProperty("--scorecard-player-max", `${basePlayerMax}px`);
      document.documentElement.style.setProperty("--scorecard-cell-height", `${baseCellHeight}px`);
      document.documentElement.style.setProperty("--scorecard-hole-mobile-width", `${mobileBaseHoleWidth}px`);
      document.documentElement.style.setProperty("--scorecard-total-mobile-width", `${mobileBaseTotalWidth}px`);
      document.documentElement.style.setProperty("--scorecard-player-mobile-max", `${mobileBasePlayerMax}px`);
      document.documentElement.style.setProperty("--odds-center-x", `${oddsCenterX}%`);
      document.documentElement.style.setProperty("--odds-center-y", `${oddsCenterY}%`);
      document.documentElement.style.setProperty("--odds-show-scale", String(oddsScale));
      document.documentElement.style.setProperty("--odds-hidden-scale", String(oddsScale * 0.96));
      document.documentElement.style.setProperty("--odds-width-factor", String(oddsWidthFactor));
      document.documentElement.style.setProperty("--odds-height-factor", String(oddsHeightFactor));
      document.documentElement.style.setProperty("--odds-font-scale", String(oddsFontScaleControl));
      document.documentElement.style.setProperty("--odds-header-font-scale", String(oddsHeaderFontScaleControl));
      document.documentElement.style.setProperty("--odds-padding", `${oddsPadding}px`);
      document.documentElement.style.setProperty("--odds-cell-padding", `${oddsCellPadding}px`);
      document.documentElement.style.setProperty("--odds-cell-height", `${oddsRowHeight}px`);
      document.documentElement.style.setProperty("--odds-team-max", `${Math.min(260, viewportWidth * 0.32)}px`);
      document.documentElement.style.setProperty("--odds-team-mobile-max", "136px");
      document.documentElement.style.setProperty("--pickem-center-x", `${pickemCenterX}%`);
      document.documentElement.style.setProperty("--pickem-center-y", `${pickemCenterY}%`);
      document.documentElement.style.setProperty("--pickem-show-scale", String(pickemScale));
      document.documentElement.style.setProperty("--pickem-hidden-scale", String(pickemScale * 0.96));
      document.documentElement.style.setProperty("--pickem-width-factor", String(pickemWidthFactor));

      if (!measured) measured = Math.max(...labels.map(label => label.length)) * 8 * fontScale;
      const spare = Math.max(8, twoSpaces + cellPadding * 2);

    function getCompletedThrough(event) {
      const teams = Object.values(event.teams || {});
      if (!teams.length) return 0;

      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      let completedThrough = 0;

      for (let hole = 1; hole <= holeCount; hole += 1) {
        const holeKey = String(hole);
        const everyTeamHasScore = teams.every(team => {
          const score = Number(team.scores?.[holeKey]);
          return Number.isFinite(score) && score > 0;
        });
        if (!everyTeamHasScore) break;
        completedThrough = hole;
      }
      return completedThrough;
    }

    function calculateStandings(event, completedThrough) {
      const holes = event.holes || {};
      const teams = event.teams || {};

      return Object.entries(teams).map(([teamId, team], index) => {
        let strokes = 0;
        let par = 0;

        for (let hole = 1; hole <= completedThrough; hole += 1) {
          const holeKey = String(hole);
          const score = Number(team.scores?.[holeKey]);
          const holePar = Number(holes[holeKey]?.par || 0);
          if (Number.isFinite(score) && score > 0) {
            strokes += score;
            par += holePar;
          }
        }

        return {
          id: teamId,
          name: team.name || `Team ${index + 1}`,
          order: Number(team.order || index + 1),
          strokes,
          par,
          toPar: strokes - par
        };
      }).sort((a, b) => {
        if (!completedThrough) return a.order - b.order || a.name.localeCompare(b.name);
        return a.toPar - b.toPar || a.strokes - b.strokes || a.order - b.order || a.name.localeCompare(b.name);
      });
    }


    function assignPositions(standings) {
      let previousKey = null;
      let previousRank = 0;
      return standings.map((team, index) => {
        const key = `${team.toPar}|${team.strokes}`;
        const rank = previousKey !== null && key === previousKey ? previousRank : index + 1;
        previousKey = key;
        previousRank = rank;
        return {
          ...team,
          rank,
          positionLabel: formatOrdinal(rank)
        };
      });
    }

    function formatPlayedLabel(completedThrough) {
      if (!completedThrough) return "Before round";
      if (completedThrough === 1) return "Through 1 hole";
      return `Through ${completedThrough} holes`;
    }


    function formatOrdinal(value) {
      const v = Math.abs(Number(value));
      const mod100 = v % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${v}th`;
      switch (v % 10) {
        case 1: return `${v}st`;
        case 2: return `${v}nd`;
        case 3: return `${v}rd`;
        default: return `${v}th`;
      }
    }


    function renderScorecardHoleCell(score, par, colorMode) {
      const relative = score - par;
      const className = getScorecardMarkClass(relative);
      if (!className) return `<td class="scorecard-hole">${score}</td>`;
      if (colorMode === "cell") {
        return `<td class="scorecard-hole scorecard-cell-fill ${className}">${score}</td>`;
      }
      return `<td class="scorecard-hole"><span class="scorecard-mark ${className}">${score}</span></td>`;
    }

    function getScorecardColorMode(event) {
      return event.scorecardColorMode === "cell" ? "cell" : "circle";
    }

    function getScorecardMarkClass(relative) {
      if (relative <= -2) return "scorecard-mark-albatross";
      if (relative === -1) return "scorecard-mark-birdie";
      if (relative === 1) return "scorecard-mark-bogey";
      if (relative === 2) return "scorecard-mark-double";
      if (relative === 3) return "scorecard-mark-triple";
      if (relative >= 4) return "scorecard-mark-quad";
      return "";
    }

    function calculateWinnerOdds(event, teams, completedThrough, holeCount) {
      const teamCount = teams.length;
      const pickems = getPickems(event, teams);
      const standings = assignPositions(calculateStandings(event, completedThrough));
      const standingById = new Map(standings.map(team => [team.id, team]));

      if (completedThrough >= holeCount && completedThrough > 0 && standings.length) {
        const winningScore = standings[0].toPar;
        return teams
          .map(team => {
            const standing = standingById.get(team.id);
            const isWinner = standing && standing.toPar === winningScore;
            return {
              id: team.id,
              name: team.name,
              probability: isWinner ? 1 : 0,
              decimalOdds: isWinner ? 1 : Number.POSITIVE_INFINITY,
              odds: isWinner ? "1.00" : "—"
            };
          })
          .sort((a, b) => a.decimalOdds - b.decimalOdds || a.name.localeCompare(b.name));
      }

      const baseStrength = new Map(teams.map(team => [team.id, 1]));
      if (pickems.length) {
        for (const team of teams) baseStrength.set(team.id, 0);
        for (const pickem of pickems) {
          pickem.picks.forEach((teamId, index) => {
            const predictedPosition = index + 1;
            const points = Math.pow(teamCount - predictedPosition + 1, 2);
            baseStrength.set(teamId, (baseStrength.get(teamId) || 0) + points);
          });
        }
      }

      const baseTotal = Array.from(baseStrength.values()).reduce((sum, value) => sum + value, 0) || 1;
      const progress = Math.max(0, Math.min(0.999, completedThrough / Math.max(1, holeCount)));
      const liveWeight = completedThrough > 0 ? Math.min(0.98, Math.pow(progress, 0.7)) : 0;
      const leaderScore = standings.length ? standings[0].toPar : 0;
      const gapPenalty = 0.8 + liveWeight * 3.2;

      const liveStrength = new Map();
      for (const team of teams) {
        const standing = standingById.get(team.id);
        if (!standing || !completedThrough) {
          liveStrength.set(team.id, 1);
          continue;
        }
        const scoreGap = Math.max(0, standing.toPar - leaderScore);
        const rankBoost = Math.pow(Math.max(1, teamCount - standing.rank + 1), 0.75);
        liveStrength.set(team.id, Math.max(0.000001, Math.exp(-scoreGap * gapPenalty) * rankBoost));
      }
      const liveTotal = Array.from(liveStrength.values()).reduce((sum, value) => sum + value, 0) || 1;

      const rows = teams.map(team => {
        const baseProbability = (baseStrength.get(team.id) || 0) / baseTotal;
        const liveProbability = (liveStrength.get(team.id) || 0) / liveTotal;
        const probability = Math.max(0.000001, baseProbability * (1 - liveWeight) + liveProbability * liveWeight);
        const decimalOdds = Math.min(99.99, Math.max(1.01, 1 / probability));
        return { id: team.id, name: team.name, probability, decimalOdds, odds: decimalOdds.toFixed(2) };
      });

      return rows.sort((a, b) => a.decimalOdds - b.decimalOdds || a.name.localeCompare(b.name));
    }

    function getTeams(event) {
      return Object.entries(event.teams || {})
        .map(([id, team], index) => ({ id, name: team.name || `Team ${index + 1}`, order: Number(team.order || index + 1) }))
        .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
    }

    function getPickems(event, teams) {
      return Object.entries(event.pickems || {})
        .map(([id, pickem], index) => ({
          id,
          name: pickem.name || `Participant ${index + 1}`,
          order: Number(pickem.order || index + 1),
          birdiesPrediction: clampInt(pickem.birdiesPrediction || 0, 0, 999),
          picks: normalizePickemPicks(pickem.picks, teams)
        }))
        .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
    }

    function normalizePickemPicks(picks, teams) {
      const validIds = new Set(teams.map(team => team.id));
      const normalized = Array.isArray(picks) ? picks.filter(teamId => validIds.has(teamId)) : [];
      for (const team of teams) {
        if (!normalized.includes(team.id)) normalized.push(team.id);
      }
      return normalized;
    }

    function scorePickem(pickem, teams, actualRanges, actualBirdies, scoringRules = getDefaultPickemScoringRules()) {
      let placementPenalty = 0;
      let exactCorrect = 0;
      pickem.picks.forEach((teamId, index) => {
        const predictedPosition = index + 1;
        const range = actualRanges.get(teamId);
        let penalty = teams.length;
        if (range) {
          if (predictedPosition < range.start) penalty = range.start - predictedPosition;
          else if (predictedPosition > range.end) penalty = predictedPosition - range.end;
          else penalty = 0;
        }
        if (penalty === 0) exactCorrect += 1;
        placementPenalty += penalty;
      });
      const birdieDiff = Math.abs((pickem.birdiesPrediction || 0) - actualBirdies);
      const birdiePenalty = calculateBirdiePenalty(birdieDiff, scoringRules);
      const finalScore = placementPenalty + (scoringRules.birdieMode === "score" ? birdiePenalty : 0);
      return { ...pickem, placementPenalty, birdieDiff, birdiePenalty, finalScore, exactCorrect };
    }

    function calculateBirdiePenalty(birdieDiff, scoringRules = getDefaultPickemScoringRules()) {
      const diff = Math.max(0, Number(birdieDiff) || 0);
      if (scoringRules.birdiePenaltyMode === "threshold") {
        const thresholds = [...(scoringRules.thresholds || [])]
          .map(row => ({ maxDiff: clampInt(row.maxDiff, 0, 999), penalty: clampNumber(row.penalty, 0, 999) }))
          .sort((a, b) => a.maxDiff - b.maxDiff);
        for (const row of thresholds) if (diff <= row.maxDiff) return row.penalty;
        if (thresholds.length) return thresholds[thresholds.length - 1].penalty + Math.max(0, diff - thresholds[thresholds.length - 1].maxDiff);
        return diff;
      }
      return diff * clampNumber(scoringRules.linearPenaltyPerBirdie, 0, 20);
    }

    function buildActualRanges(standings) {
      const ranges = new Map();
      let index = 0;
      while (index < standings.length) {
        const start = index + 1;
        const key = `${standings[index].toPar}|${standings[index].strokes}`;
        let endIndex = index;
        while (endIndex + 1 < standings.length && `${standings[endIndex + 1].toPar}|${standings[endIndex + 1].strokes}` === key) endIndex += 1;
        const end = endIndex + 1;
        for (let i = index; i <= endIndex; i += 1) ranges.set(standings[i].id, { start, end });
        index = endIndex + 1;
      }
      return ranges;
    }

    function assignPickemPositions(rows) {
      const sorted = [...rows].sort((a, b) =>
        a.finalScore - b.finalScore ||
        a.birdieDiff - b.birdieDiff ||
        b.exactCorrect - a.exactCorrect ||
        a.name.localeCompare(b.name)
      );
      let previousKey = null;
      let previousRank = 0;
      return sorted.map((row, index) => {
        const key = `${row.finalScore}|${row.birdieDiff}`;
        const rank = previousKey !== null && key === previousKey ? previousRank : index + 1;
        previousKey = key;
        previousRank = rank;
        return { ...row, rank, positionLabel: formatOrdinal(rank) };
      });
    }

    function getPickemScoringRules(event) {
      const defaults = getDefaultPickemScoringRules();
      const saved = event.pickemScoring || {};
      const savedThresholds = Array.isArray(saved.thresholds) ? saved.thresholds : [];
      const thresholds = defaults.thresholds.map((threshold, index) => ({
        maxDiff: clampInt(savedThresholds[index]?.maxDiff ?? threshold.maxDiff, 0, 999),
        penalty: clampNumber(savedThresholds[index]?.penalty ?? threshold.penalty, 0, 999)
      })).sort((a, b) => a.maxDiff - b.maxDiff);
      return {
        birdieMode: saved.birdieMode === "score" ? "score" : defaults.birdieMode,
        birdiePenaltyMode: saved.birdiePenaltyMode === "threshold" ? "threshold" : defaults.birdiePenaltyMode,
        linearPenaltyPerBirdie: clampNumber(saved.linearPenaltyPerBirdie ?? defaults.linearPenaltyPerBirdie, 0, 20),
        thresholds
      };
    }

    function getDefaultPickemScoringRules() {
      return {
        birdieMode: "tiebreak",
        birdiePenaltyMode: "linear",
        linearPenaltyPerBirdie: 1,
        thresholds: [
          { maxDiff: 1, penalty: 0 },
          { maxDiff: 2, penalty: 1 },
          { maxDiff: 4, penalty: 2 }
        ]
      };
    }

    function countBirdies(event, completedThrough) {
      let birdies = 0;
      for (const team of Object.values(event.teams || {})) {
        for (let hole = 1; hole <= completedThrough; hole += 1) {
          const score = Number(team.scores?.[String(hole)]);
          const par = Number(event.holes?.[String(hole)]?.par || 0);
          if (Number.isFinite(score) && Number.isFinite(par) && score - par === -1) birdies += 1;
        }
      }
      return birdies;
    }

    function formatPickemScore(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "0";
      return Number.isInteger(number) ? String(number) : number.toFixed(2).replace(/\.?0+$/, "");
    }

    function formatToPar(value) {
      if (value === 0) return "E";
      return value > 0 ? `+${value}` : String(value);
    }

    function clampInt(value, min, max) {
      const number = Number.parseInt(value, 10);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function clampNumber(value, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }
  </script>
