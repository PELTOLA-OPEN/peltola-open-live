<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peltola Open Overlay</title>
  <style>
    :root {
      --panel: rgba(0, 0, 0, 0.5);
      --panel-strong: rgba(0, 0, 0, 0.5);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --line-subtle: rgba(255, 255, 255, 0.08);
      --popup-border: rgba(255, 255, 255, 0.72);
      --table-grid: rgba(255, 255, 255, 0.46);
      --table-head-bg: rgba(255, 255, 255, 0.1);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.debug {
      background: linear-gradient(135deg, #295b41, #1b2838);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      color: var(--text);
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .hidden { display: none !important; }

    .compact-box {
      position: absolute;
      right: 3.5vw;
      bottom: 4.5vh;
      display: inline-block;
      width: max-content;
      max-width: min(520px, 44vw);
      padding: 12px 14px 11px;
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(2px);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
      transform: scale(var(--overlay-page-scale, 1));
      transform-origin: bottom right;
    }

    .box-title {
      max-width: 100%;
      overflow: hidden;
      font-size: calc(clamp(12px, 1.05vw, 16px) * var(--overlay-page-scale, 1));
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .box-subtitle {
      margin-top: 1px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: calc(clamp(10px, 0.9vw, 13px) * var(--overlay-page-scale, 1));
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .score-table {
      display: grid;
      grid-template-columns: max-content max-content;
      column-gap: 12px;
      row-gap: 0;
      align-items: center;
    }

    .table-head,
    #scoreRows { display: contents; }

    .table-head div {
      padding-bottom: 5px;
      color: var(--muted);
      font-size: calc(clamp(9px, 0.8vw, 11px) * var(--overlay-page-scale, 1));
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-row { display: contents; }

    .team-name,
    .score {
      padding: 4px 0;
      border-top: 1px solid var(--line-subtle);
      font-size: calc(clamp(13px, 1.25vw, 18px) * var(--overlay-page-scale, 1));
      line-height: 1.12;
    }

    .team-name {
      max-width: min(370px, 34vw);
      overflow: hidden;
      font-weight: 850;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .score {
      min-width: 34px;
      font-weight: 950;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      color: var(--muted);
      font-size: calc(clamp(13px, 1.2vw, 18px) * var(--overlay-page-scale, 1));
      font-weight: 750;
    }

    .ticker {
      position: absolute;
      left: calc(3vw + var(--ticker-offset-x, 0px));
      right: calc(3vw - var(--ticker-offset-x, 0px));
      bottom: calc(4vh + var(--ticker-offset-y, 0px));
      height: var(--ticker-height, clamp(42px, 4.8vw, 58px));
      display: flex;
      overflow: hidden;
      border-radius: 16px;
      background: var(--panel);
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      height: 100%;
      animation: ticker-scroll var(--ticker-duration, 27.2s) linear infinite;
      will-change: transform;
    }

    .ticker-copy {
      display: flex;
      align-items: center;
      gap: 34px;
      padding: 0 17px;
      white-space: nowrap;
    }

    .ticker-item {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      font-size: calc(clamp(15px, 1.6vw, 23px) * var(--overlay-page-scale, 1));
      line-height: 1;
    }

    .ticker-team { font-weight: 850; }

    .ticker-score {
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .ticker-separator {
      align-self: stretch;
      width: 30px;
      margin: 0;
      background: var(--panel-strong);
      border-radius: 0;
      opacity: 1;
    }

    .ticker-info {
      display: grid;
      place-items: center;
      min-width: clamp(104px, 10vw, 150px);
      padding: 0 12px;
      border-right: 1px solid var(--line);
      background: var(--panel-strong);
      font-size: calc(clamp(11px, 1vw, 15px) * var(--overlay-page-scale, 1));
      font-weight: 950;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .helsinki-clock {
      position: absolute;
      left: calc(3vw + var(--ticker-offset-x, 0px));
      bottom: calc(4vh + var(--ticker-height, 58px) + 8px + var(--ticker-offset-y, 0px));
      min-width: clamp(104px, 10vw, 150px);
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--panel-strong);
      color: var(--text);
      font-size: calc(clamp(12px, 1.1vw, 17px) * var(--overlay-page-scale, 1));
      font-weight: 950;
      letter-spacing: 0.06em;
      line-height: 1;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    .ticker-logo {
      position: absolute;
      left: calc(3vw + var(--ticker-offset-x, 0px));
      bottom: calc(4vh + var(--ticker-height, 58px) + 8px + var(--ticker-offset-y, 0px));
      width: var(--ticker-logo-size, 72px);
      height: var(--ticker-logo-size, 72px);
      display: grid;
      place-items: center;
      transform-origin: left bottom;
    }

    .ticker-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
    }

    .scorecard-pop {
      position: absolute;
      left: var(--scorecard-center-x, 50%);
      top: var(--scorecard-center-y, 43%);
      width: auto;
      max-width: 96vw;
      max-height: 74vh;
      transform: translate(-50%, -50%) translateY(24px) scale(var(--scorecard-hidden-scale, 0.96)) scaleX(var(--scorecard-width-factor, 1)) scaleY(var(--scorecard-height-factor, 1));
      transform-origin: center center;
      opacity: 0;
      padding: 12px 12px 14px;
      border: 2px solid var(--popup-border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .scorecard-pop.show {
      transform: translate(-50%, -50%) translateY(0) scale(var(--scorecard-show-scale, 1)) scaleX(var(--scorecard-width-factor, 1)) scaleY(var(--scorecard-height-factor, 1));
      opacity: 1;
    }

    .odds-pop {
      position: absolute;
      left: var(--odds-center-x, 50%);
      top: var(--odds-center-y, 38%);
      display: inline-block;
      width: max-content;
      max-width: 94vw;
      max-height: 76vh;
      transform: translate(-50%, -50%) translateY(24px) scale(var(--odds-hidden-scale, 0.96)) scaleX(var(--odds-width-factor, 1)) scaleY(var(--odds-height-factor, 1));
      transform-origin: center center;
      opacity: 0;
      padding: 16px 16px 18px;
      border: 2px solid var(--popup-border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .odds-pop.show {
      transform: translate(-50%, -50%) translateY(0) scale(var(--odds-show-scale, 1)) scaleX(var(--odds-width-factor, 1)) scaleY(var(--odds-height-factor, 1));
      opacity: 1;
    }

    .odds-header {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .odds-title {
      overflow: hidden;
      font-size: clamp(17px, 2vw, 30px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .odds-subtitle {
      display: none;
    }

    .odds-table-wrap {
      display: inline-block;
      overflow: hidden;
      width: var(--odds-table-width, max-content);
      max-width: calc(94vw - 32px);
    }

    .odds-pop-table {
      width: var(--odds-table-width, auto);
      border-collapse: collapse;
      table-layout: fixed;
      color: white;
      font-variant-numeric: tabular-nums;
      --odds-grid: var(--table-grid);
    }

    .odds-pop-table th,
    .odds-pop-table td {
      height: var(--odds-cell-height, clamp(28px, 2.6vw, 39px));
      border: 1px solid var(--odds-grid);
      padding: 3px 6px;
      vertical-align: middle;
      line-height: 1;
      background-clip: padding-box;
      white-space: nowrap;
    }

    .odds-pop-table th {
      background: var(--table-head-bg);
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 950;
      text-transform: uppercase;
    }

    .odds-pop-table td {
      font-size: clamp(12px, 1.2vw, 19px);
      font-weight: 850;
    }

    .odds-pos-cell {
      width: var(--odds-pos-width, 32px);
      min-width: var(--odds-pos-width, 32px);
      text-align: center;
      font-weight: 950 !important;
    }

    .odds-team-cell {
      width: var(--odds-team-width, auto);
      min-width: var(--odds-team-width, auto);
      max-width: var(--odds-team-width, var(--odds-team-max, min(260px, 32vw)));
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .odds-value-cell {
      width: var(--odds-value-width, 54px);
      min-width: var(--odds-value-width, 54px);
      text-align: right;
      font-weight: 950 !important;
    }

    .scorecard-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .scorecard-title {
      overflow: hidden;
      font-size: clamp(17px, 2vw, 30px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scorecard-through {
      flex: none;
      color: var(--muted);
      font-size: clamp(12px, 1.15vw, 18px);
      font-weight: 950;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .scorecard-table-wrap {
      overflow: hidden;
      width: max-content;
      max-width: 100%;
    }

    .scorecard-table {
      width: auto;
      border-collapse: collapse;
      table-layout: auto;
      color: white;
      font-variant-numeric: tabular-nums;
      --scorecard-grid: var(--table-grid);
    }

    .scorecard-table th,
    .scorecard-table td {
      height: var(--scorecard-cell-height, clamp(24px, 2.45vw, 35px));
      border: 1px solid var(--scorecard-grid);
      padding: 2px 3px;
      text-align: center;
      vertical-align: middle;
      line-height: 1;
      background-clip: padding-box;
    }

    .scorecard-table th {
      background: var(--table-head-bg);
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 950;
      text-transform: uppercase;
    }

    .scorecard-table td {
      font-size: clamp(11px, 1.1vw, 18px);
      font-weight: 850;
      line-height: 1;
    }

    .scorecard-player {
      width: 1%;
      max-width: var(--scorecard-player-max, min(360px, 31vw));
      text-align: left !important;
      padding-left: 7px !important;
      padding-right: 7px !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scorecard-hole {
      width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      min-width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      max-width: var(--scorecard-hole-width, clamp(22px, 2.25vw, 34px));
      text-align: center !important;
      vertical-align: middle !important;
      overflow: hidden;
    }

    .scorecard-total {
      width: var(--scorecard-total-width, clamp(42px, 4.2vw, 66px));
      min-width: var(--scorecard-total-width, clamp(42px, 4.2vw, 66px));
      font-weight: 950 !important;
    }

    .scorecard-mark {
      display: inline-grid;
      place-items: center;
      width: clamp(18px, 1.75vw, 28px);
      height: clamp(18px, 1.75vw, 28px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 50%;
      color: #ffffff;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .scorecard-cell-fill {
      font-weight: 950 !important;
    }

    .scorecard-mark-albatross { background: #245f9e; }
    .scorecard-mark-birdie { background: #6db7f2; }
    .scorecard-mark-bogey { background: #e3a17d; color: #111111; }
    .scorecard-mark-double { background: #d86431; color: #111111; }
    .scorecard-mark-triple { background: #d00000; color: #111111; }
    .scorecard-mark-quad { background: #aa0000; color: #111111; }

    .scorecard-empty-cell {
      color: rgba(255, 255, 255, 0.28);
    }


    @media (max-width: 760px) {
      body.debug {
        background: #102018;
      }

      .compact-box {
        right: 12px;
        bottom: 16px;
        max-width: calc(100vw - 24px);
      }

      .ticker {
        left: calc(8px + var(--ticker-offset-x, 0px));
        right: calc(8px - var(--ticker-offset-x, 0px));
        bottom: calc(12px + var(--ticker-offset-y, 0px));
        height: var(--ticker-height, 44px);
        border-radius: 12px;
      }

      .ticker-info {
        min-width: calc(84px * var(--overlay-page-scale, 1));
        padding: 0 calc(8px * var(--overlay-page-scale, 1));
        font-size: calc(10px * var(--overlay-page-scale, 1));
      }

      .helsinki-clock {
        left: calc(8px + var(--ticker-offset-x, 0px));
        bottom: calc(12px + var(--ticker-height, 44px) + 6px + var(--ticker-offset-y, 0px));
        min-width: calc(84px * var(--overlay-page-scale, 1));
        padding: calc(7px * var(--overlay-page-scale, 1)) calc(8px * var(--overlay-page-scale, 1));
        border-radius: 10px;
        font-size: calc(11px * var(--overlay-page-scale, 1));
      }

      .ticker-copy {
        gap: calc(24px * var(--overlay-page-scale, 1));
        padding: 0 calc(12px * var(--overlay-page-scale, 1));
      }

      .ticker-item {
        font-size: calc(14px * var(--overlay-page-scale, 1));
      }

      .scorecard-pop {
        left: var(--scorecard-center-x, 50%);
        top: var(--scorecard-center-y, 43%);
        width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 76px);
        padding: 10px;
        border-radius: 12px;
      }

      .scorecard-table-wrap {
        width: 100%;
      }

      .scorecard-title {
        font-size: 16px;
      }

      .scorecard-through {
        font-size: 11px;
      }

      .scorecard-table th,
      .scorecard-table td {
        height: 22px;
        padding: 1px 2px;
      }

      .scorecard-table th {
        font-size: 9px;
      }

      .scorecard-table td {
        font-size: 10px;
      }

      .scorecard-player {
        max-width: var(--scorecard-player-mobile-max, 116px);
        padding-left: 4px !important;
        padding-right: 4px !important;
      }

      .scorecard-hole {
        width: var(--scorecard-hole-mobile-width, 20px);
        min-width: var(--scorecard-hole-mobile-width, 20px);
        max-width: var(--scorecard-hole-mobile-width, 20px);
      }

      .scorecard-mark {
        width: 14px;
        min-width: 14px;
        max-width: 14px;
        height: 14px;
        min-height: 14px;
        max-height: 14px;
        font-size: 9px;
      }

      .scorecard-total {
        width: var(--scorecard-total-mobile-width, 38px);
      }

      .scorecard-mark {
        width: 16px;
        height: 16px;
      }
      .odds-pop {
        left: var(--odds-center-x, 50%);
        top: var(--odds-center-y, 38%);
        width: max-content;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 76px);
        padding: 10px;
        border-radius: 12px;
      }

      .odds-table-wrap {
        max-width: calc(100vw - 36px);
      }

      .odds-title { font-size: 15px; }
      .odds-pop-table th,
      .odds-pop-table td {
        height: 25px;
        padding: 2px 4px;
      }
      .odds-pop-table th { font-size: 9px; }
      .odds-pop-table td { font-size: 11px; }
      .odds-team-cell {
        width: var(--odds-team-width, auto);
        min-width: var(--odds-team-width, auto);
        max-width: var(--odds-team-width, var(--odds-team-mobile-max, 136px));
      }
      .odds-pos-cell { min-width: var(--odds-pos-width, 28px); }
      .odds-value-cell { min-width: var(--odds-value-width, 46px); }
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-25%); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section id="compactBox" class="compact-box hidden" aria-live="polite">
      <div id="boxTitle" class="box-title">Peltola Open</div>
      <div id="boxSubtitle" class="box-subtitle">Before round</div>
      <div id="scoreTable" class="score-table">
        <div class="table-head">
          <div>Team</div>
          <div class="score">Score</div>
        </div>
        <div id="scoreRows"></div>
      </div>
    </section>

    <section id="ticker" class="ticker hidden" aria-live="polite">
      <div id="tickerInfo" class="ticker-info">Before round</div>
      <div class="ticker-viewport">
        <div id="tickerTrack" class="ticker-track"></div>
      </div>
    </section>

    <div id="helsinkiClock" class="helsinki-clock hidden" aria-live="off">--:--:--</div>
    <div id="tickerLogo" class="ticker-logo hidden" aria-live="off"><img src="peltola-logo-round.png" alt="Peltola Sport logo" /></div>

    <section id="scorecardPop" class="scorecard-pop hidden" aria-live="polite">
      <div class="scorecard-header">
        <div id="scorecardTitle" class="scorecard-title">Peltola Open</div>
        <div id="scorecardThrough" class="scorecard-through">Through 1</div>
      </div>
      <div id="scorecardTableWrap" class="scorecard-table-wrap"></div>
    </section>
    <section id="oddsPop" class="odds-pop hidden" aria-live="polite">
      <div class="odds-header">
        <div id="oddsTitle" class="odds-title">Live odds</div>
        <div id="oddsSubtitle" class="odds-subtitle">Before round</div>
      </div>
      <div id="oddsTableWrap" class="odds-table-wrap"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const params = new URLSearchParams(location.search);
    const eventId = params.get("event") || "2026";
    const maxRows = Number(params.get("rows") || 12);
    const forcedMode = params.get("mode");

    if (params.get("debug") === "1") document.body.classList.add("debug");

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const compactBoxEl = document.getElementById("compactBox");
    const boxTitleEl = document.getElementById("boxTitle");
    const boxSubtitleEl = document.getElementById("boxSubtitle");
    const scoreTableEl = document.getElementById("scoreTable");
    let scoreRowsEl = document.getElementById("scoreRows");
    const tickerEl = document.getElementById("ticker");
    const tickerTrackEl = document.getElementById("tickerTrack");
    const tickerInfoEl = document.getElementById("tickerInfo");
    const scorecardPopEl = document.getElementById("scorecardPop");
    const scorecardTitleEl = document.getElementById("scorecardTitle");
    const scorecardThroughEl = document.getElementById("scorecardThrough");
    const scorecardTableWrapEl = document.getElementById("scorecardTableWrap");
    const oddsPopEl = document.getElementById("oddsPop");
    const oddsTitleEl = document.getElementById("oddsTitle");
    const oddsSubtitleEl = document.getElementById("oddsSubtitle");
    const oddsTableWrapEl = document.getElementById("oddsTableWrap");
    const helsinkiClockEl = document.getElementById("helsinkiClock");

    let lastFlashSequence = null;
    let scorecardHideTimer = null;
    let oddsHideTimer = null;
    let scorecardPreviewActive = false;
    let oddsPreviewActive = false;
    let flashActive = false;
    let oddsFlashActive = false;
    let lastOddsFlashSequence = null;
    let clockTimer = null;
    let latestEvent = null;
    let firebaseLoaded = false;
    let firebaseError = null;

    onValue(
      ref(db, `events/${eventId}`),
      snapshot => {
        firebaseLoaded = true;
        firebaseError = null;
        latestEvent = snapshot.val();
        renderOverlay();
      },
      error => {
        firebaseLoaded = true;
        firebaseError = error;
        latestEvent = null;
        console.error(error);
        renderOverlay();
      }
    );

    function renderOverlay() {
      if (firebaseError || !firebaseLoaded || !isPlainObject(latestEvent) || latestEvent.showStandings === false) {
        hideAllOverlay();
        return;
      }

      const event = latestEvent;

      applyOverlayLayout(event);
      updateClockVisibility(event);
      const mode = forcedMode || event.overlayMode || "compact";
      const completedThrough = getCompletedThrough(event);

    function applyOverlayTheme(event) {
      const theme = {
        backgroundColor: "#000000",
        lineColor: "#ffffff",
        textColor: "#ffffff",
        overlayOpacity: 50,
        ...(event.overlayTheme || {})
      };
      const background = hexToRgb(theme.backgroundColor, { r: 0, g: 0, b: 0 });
      const line = hexToRgb(theme.lineColor, { r: 255, g: 255, b: 255 });
      const text = hexToRgb(theme.textColor, { r: 255, g: 255, b: 255 });
      const opacity = clampNumber(theme.overlayOpacity, 0, 100) / 100;
      const strongOpacity = Math.min(1, opacity + 0.08);

      document.documentElement.style.setProperty("--panel", rgba(background, opacity));
      document.documentElement.style.setProperty("--panel-strong", rgba(background, strongOpacity));
      document.documentElement.style.setProperty("--text", rgb(text));
      document.documentElement.style.setProperty("--muted", rgba(text, 0.72));
      document.documentElement.style.setProperty("--line", rgba(line, 0.16));
      document.documentElement.style.setProperty("--line-subtle", rgba(line, 0.08));
      document.documentElement.style.setProperty("--popup-border", rgba(line, 0.72));
      document.documentElement.style.setProperty("--table-grid", rgba(line, 0.46));
      document.documentElement.style.setProperty("--table-head-bg", rgba(line, 0.10));
    }

    function hexToRgb(value, fallback) {
      const text = String(value || "").trim();
      const match = /^#?([0-9a-fA-F]{6})$/.exec(text);
      if (!match) return fallback;
      const hex = match[1];
      return {
        r: parseInt(hex.slice(0, 2), 16),
        g: parseInt(hex.slice(2, 4), 16),
        b: parseInt(hex.slice(4, 6), 16)
      };
    }

    function rgba(color, alpha) {
      return `rgba(${color.r}, ${color.g}, ${color.b}, ${clampNumber(alpha, 0, 1)})`;
    }

    function rgb(color) {
      return `rgb(${color.r}, ${color.g}, ${color.b})`;

    function maybeShowScorecardFlash(event) {
      const flash = event.overlayFlash;
      if (!flash || flash.type !== "scorecard" || !flash.sequence) return;
      if (flash.sequence === lastFlashSequence) return;

      const durationMs = Number(flash.durationMs || 10000);
      const triggeredAt = Number(flash.triggeredAt || 0);
      if (triggeredAt && Date.now() - triggeredAt > durationMs + 1500) {
        lastFlashSequence = flash.sequence;
        return;
      }

      lastFlashSequence = flash.sequence;
      const throughHole = clampInt(flash.hole || getCompletedThrough(event), 0, clampInt(event.holeCount || 18, 1, 36));
      if (!throughHole) return;

      renderScorecardPop(event, throughHole);
      showScorecardPop(durationMs);
    }

    function maybeShowOddsFlash(event) {
      const flash = event.overlayFlash;
      if (!flash || flash.type !== "odds" || !flash.sequence) return;
      if (flash.sequence === lastOddsFlashSequence) return;

      const durationMs = Number(flash.durationMs || 10000);
      const triggeredAt = Number(flash.triggeredAt || 0);
      if (triggeredAt && Date.now() - triggeredAt > durationMs + 1500) {
        lastOddsFlashSequence = flash.sequence;
        return;
      }

      lastOddsFlashSequence = flash.sequence;
      renderOddsPop(event);
      showOddsPop(durationMs);

    function showScorecardPop(durationMs = 10000, persistent = false) {

    function hideOddsPop() {

    function updateScorecardPreview(event) {

      if (previewEnabled) {

    function updateClockVisibility(event) {

    function updateHelsinkiClock() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(new Date());
      const value = Object.fromEntries(parts.filter(part => part.type !== "literal").map(part => [part.type, part.value]));
      const showClock = eventState?.showHelsinkiClock !== false;
      const second = Number(value.second || 0);
      const showLogo = showClock && second >= 0 && second < 10;
      helsinkiClockEl.textContent = `${value.hour}:${value.minute}:${value.second}`;
      helsinkiClockEl.classList.toggle("hidden", !showClock || showLogo);
      tickerLogoEl.classList.toggle("hidden", !showLogo);

    function renderScorecardPop(event, throughHole) {
      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      const standings = assignPositions(calculateStandings(event, throughHole));

      scorecardTitleEl.textContent = event.name || "Peltola Open";

          const par = Number(event.holes?.[holeKey]?.par || 0);
          if (!Number.isFinite(score) || score <= 0 || !Number.isFinite(par) || par <= 0) return `<td class="scorecard-hole scorecard-empty-cell">·</td>`;

          return renderScorecardHoleCell(score, par, colorMode);

        return `

      const teams = getTeams(event);

      oddsTitleEl.textContent = "Live odds";

      const viewportWidth = Math.max(320, window.innerWidth || 720);

      const headerFontSize = mobile ? 9 : Math.max(10, Math.min(14, viewportWidth * 0.009));

          ctx.font = `950 ${headerFontSize}px system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
          measuredNameWidth = Math.max(measuredNameWidth, ctx.measureText("Team").width);

      } catch (_) {}
      if (!measuredNameWidth) {

        measuredNameWidth = longestNameLength * (mobile ? 5.9 : 8.6);
      }
      const teamPadding = mobile ? 12 : 16;
      const teamWidthCap = mobile ? Math.min(170, viewportWidth * 0.48) : Math.min(300, viewportWidth * 0.26);
      const oddsTeamWidth = Math.round(Math.max(52, Math.min(measuredNameWidth + teamPadding, teamWidthCap)));
      const oddsPosWidth = mobile ? 32 : 42;
      const oddsValueWidth = mobile ? 50 : 64;
      const oddsTableWidth = oddsPosWidth + oddsTeamWidth + oddsValueWidth + 3;

      const rows = oddsRows.map((row, index) => `

      oddsTableWrapEl.innerHTML = `
        <table class="odds-pop-table" style="--odds-table-width: ${oddsTableWidth}px; --odds-pos-width: ${oddsPosWidth}px; --odds-team-width: ${oddsTeamWidth}px; --odds-value-width: ${oddsValueWidth}px;">
          <colgroup>
            <col style="width: ${oddsPosWidth}px;" />
            <col style="width: ${oddsTeamWidth}px;" />
            <col style="width: ${oddsValueWidth}px;" />
          </colgroup>
          <thead>
            <tr>
              <th class="odds-pos-cell">Pos</th>
              <th class="odds-team-cell">Team</th>
              <th class="odds-value-cell">Odds</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td class="odds-pos-cell">--</td><td class="odds-team-cell">Add teams</td><td class="odds-value-cell">--</td></tr>`}</tbody>
        </table>
      `;

    function renderCompactBox(event, standings, completedThrough, label) {
      tickerEl.classList.add("hidden");
      compactBoxEl.classList.remove("hidden");

      boxTitleEl.textContent = event.name || "Peltola Open";
      boxSubtitleEl.textContent = label;

      const rows = standings.slice(0, maxRows);
      scoreRowsEl.outerHTML = `<div id="scoreRows">${rows.length
        ? rows.map(team => `
          <div class="score-row">
            <div class="team-name">${escapeHtml(team.positionLabel)} - ${escapeHtml(team.name)}</div>
            <div class="score">${completedThrough ? formatToPar(team.toPar) : "--"}</div>
          </div>
        `).join("")
        : `<div class="empty">Add teams in the control panel.</div>`}</div>`;
      scoreRowsEl = document.getElementById("scoreRows");
    }

    function renderTicker(event, standings, completedThrough, label) {
      compactBoxEl.classList.add("hidden");
      tickerEl.classList.remove("hidden");

      tickerInfoEl.textContent = completedThrough ? `Through ${completedThrough}` : "Before round";

      const content = standings.length
        ? standings.map(team => `
          <span class="ticker-item">
            <span class="ticker-team">${escapeHtml(team.positionLabel)} - ${escapeHtml(team.name)}</span>
            <span class="ticker-score">${completedThrough ? formatToPar(team.toPar) : "--"}</span>
          </span>
        `).join("")
        : `<span class="ticker-item"><span class="ticker-team">Add teams in the control panel</span></span>`;

      tickerTrackEl.innerHTML = Array.from({ length: 4 }, (_, index) => `
        <div class="ticker-copy" ${index ? 'aria-hidden="true"' : ''}>${content}<span class="ticker-separator" aria-hidden="true"></span></div>
      `).join("");

      const oldDurationSeconds = Math.max(26, Math.min(70, standings.length * 5 + 18));
      const fasterDurationSeconds = oldDurationSeconds / 1.25;
      tickerTrackEl.style.setProperty("--ticker-duration", `${fasterDurationSeconds}s`);
    }

    function getCompletedThrough(event) {
      const teams = Object.values(event.teams || {});
      if (!teams.length) return 0;

      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      let completedThrough = 0;

      for (let hole = 1; hole <= holeCount; hole += 1) {
        const holeKey = String(hole);
        const everyTeamHasScore = teams.every(team => {
          const score = Number(team.scores?.[holeKey]);
          return Number.isFinite(score) && score > 0;
        });
        if (!everyTeamHasScore) break;
        completedThrough = hole;
      }
      return completedThrough;
    }

    function calculateStandings(event, completedThrough) {
      const holes = event.holes || {};
      const teams = event.teams || {};

      return Object.entries(teams).map(([teamId, team], index) => {
        let strokes = 0;
        let par = 0;

        for (let hole = 1; hole <= completedThrough; hole += 1) {
          const holeKey = String(hole);
          const score = Number(team.scores?.[holeKey]);
          const holePar = Number(holes[holeKey]?.par || 0);
          if (Number.isFinite(score) && score > 0) {
            strokes += score;
            par += holePar;
          }
        }

        return {
          id: teamId,
          name: team.name || `Team ${index + 1}`,
          order: Number(team.order || index + 1),
          strokes,
          par,
          toPar: strokes - par
        };
      }).sort((a, b) => {
        if (!completedThrough) return a.order - b.order || a.name.localeCompare(b.name);
        return a.toPar - b.toPar || a.strokes - b.strokes || a.order - b.order || a.name.localeCompare(b.name);
      });
    }


    function assignPositions(standings) {
      let previousKey = null;
      let previousRank = 0;
      return standings.map((team, index) => {
        const key = `${team.toPar}|${team.strokes}`;
        const rank = previousKey !== null && key === previousKey ? previousRank : index + 1;
        previousKey = key;
        previousRank = rank;
        return {
          ...team,
          rank,
          positionLabel: formatOrdinal(rank)
        };
      });
    }

    function formatPlayedLabel(completedThrough) {
      if (!completedThrough) return "Before round";
      if (completedThrough === 1) return "Through 1 hole";
      return `Through ${completedThrough} holes`;
    }


    function formatOrdinal(value) {
      const v = Math.abs(Number(value));
      const mod100 = v % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${v}th`;
      switch (v % 10) {
        case 1: return `${v}st`;
        case 2: return `${v}nd`;
        case 3: return `${v}rd`;
        default: return `${v}th`;
      }
    }


    function renderScorecardHoleCell(score, par, colorMode) {
      const relative = score - par;
      const className = getScorecardMarkClass(relative);
      if (!className) return `<td class="scorecard-hole">${score}</td>`;
      if (colorMode === "cell") {
        return `<td class="scorecard-hole scorecard-cell-fill ${className}">${score}</td>`;
      }
      return `<td class="scorecard-hole"><span class="scorecard-mark ${className}">${score}</span></td>`;
    }

    function getScorecardColorMode(event) {
      return event.scorecardColorMode === "cell" ? "cell" : "circle";
    }

    function getScorecardMarkClass(relative) {
      if (relative <= -2) return "scorecard-mark-albatross";
      if (relative === -1) return "scorecard-mark-birdie";
      if (relative === 1) return "scorecard-mark-bogey";
      if (relative === 2) return "scorecard-mark-double";
      if (relative === 3) return "scorecard-mark-triple";
      if (relative >= 4) return "scorecard-mark-quad";
      return "";
    }

    function calculateWinnerOdds(event, teams, completedThrough, holeCount) {
      const teamCount = teams.length;
      const pickems = getPickems(event, teams);
      const standings = assignPositions(calculateStandings(event, completedThrough));
      const standingById = new Map(standings.map(team => [team.id, team]));

      if (completedThrough >= holeCount && completedThrough > 0 && standings.length) {
        const winningScore = standings[0].toPar;
        return teams
          .map(team => {
            const standing = standingById.get(team.id);
            const isWinner = standing && standing.toPar === winningScore;
            return {
              id: team.id,
              name: team.name,
              probability: isWinner ? 1 : 0,
              decimalOdds: isWinner ? 1 : Number.POSITIVE_INFINITY,
              odds: isWinner ? "1.00" : "—"
            };
          })
          .sort((a, b) => a.decimalOdds - b.decimalOdds || a.name.localeCompare(b.name));
      }

      const baseStrength = new Map(teams.map(team => [team.id, 1]));
      if (pickems.length) {
        for (const team of teams) baseStrength.set(team.id, 0);
        for (const pickem of pickems) {
          pickem.picks.forEach((teamId, index) => {
            const predictedPosition = index + 1;
            const points = Math.pow(teamCount - predictedPosition + 1, 2);
            baseStrength.set(teamId, (baseStrength.get(teamId) || 0) + points);
          });
        }
      }

      const baseTotal = Array.from(baseStrength.values()).reduce((sum, value) => sum + value, 0) || 1;
      const progress = Math.max(0, Math.min(0.999, completedThrough / Math.max(1, holeCount)));
      const liveWeight = completedThrough > 0 ? Math.min(0.98, Math.pow(progress, 0.7)) : 0;
      const leaderScore = standings.length ? standings[0].toPar : 0;
      const gapPenalty = 0.8 + liveWeight * 3.2;

      const liveStrength = new Map();
      for (const team of teams) {
        const standing = standingById.get(team.id);
        if (!standing || !completedThrough) {
          liveStrength.set(team.id, 1);
          continue;
        }
        const scoreGap = Math.max(0, standing.toPar - leaderScore);
        const rankBoost = Math.pow(Math.max(1, teamCount - standing.rank + 1), 0.75);
        liveStrength.set(team.id, Math.max(0.000001, Math.exp(-scoreGap * gapPenalty) * rankBoost));
      }
      const liveTotal = Array.from(liveStrength.values()).reduce((sum, value) => sum + value, 0) || 1;

      const rows = teams.map(team => {
        const baseProbability = (baseStrength.get(team.id) || 0) / baseTotal;
        const liveProbability = (liveStrength.get(team.id) || 0) / liveTotal;
        const probability = Math.max(0.000001, baseProbability * (1 - liveWeight) + liveProbability * liveWeight);
        const decimalOdds = Math.min(99.99, Math.max(1.01, 1 / probability));
        return { id: team.id, name: team.name, probability, decimalOdds, odds: decimalOdds.toFixed(2) };
      });

      return rows.sort((a, b) => a.decimalOdds - b.decimalOdds || a.name.localeCompare(b.name));
    }

    function getTeams(event) {
      return Object.entries(event.teams || {})
        .map(([id, team], index) => ({ id, name: team.name || `Team ${index + 1}`, order: Number(team.order || index + 1) }))
        .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
    }

    function getPickems(event, teams) {
      return Object.entries(event.pickems || {})
        .map(([id, pickem], index) => ({
          id,
          name: pickem.name || `Participant ${index + 1}`,
          order: Number(pickem.order || index + 1),
          picks: normalizePickemPicks(pickem.picks, teams)
        }))
        .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
    }

    function normalizePickemPicks(picks, teams) {
      const validIds = new Set(teams.map(team => team.id));
      const normalized = Array.isArray(picks) ? picks.filter(teamId => validIds.has(teamId)) : [];
      for (const team of teams) {
        if (!normalized.includes(team.id)) normalized.push(team.id);
      }
      return normalized;
    }

    function formatToPar(value) {
      if (value === 0) return "E";
      return value > 0 ? `+${value}` : String(value);
    }

    function clampInt(value, min, max) {
      const number = Number.parseInt(value, 10);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function clampNumber(value, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }
  </script>
