<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peltola Open Overlay</title>
  <style>
    :root {
      --panel: rgba(0, 0, 0, 0.76);
      --panel-strong: rgba(0, 0, 0, 0.88);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.debug {
      background: linear-gradient(135deg, #295b41, #1b2838);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      color: var(--text);
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .hidden {
      display: none !important;
    }

    .compact-box {
      position: absolute;
      right: 3.5vw;
      bottom: 4.5vh;
      width: min(360px, 34vw);
      padding: 14px 16px 12px;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
    }

    .box-title {
      overflow: hidden;
      font-size: clamp(13px, 1.2vw, 18px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .box-subtitle {
      margin-top: 2px;
      margin-bottom: 10px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: clamp(11px, 1vw, 14px);
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .table-head,
    .score-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 58px;
      gap: 10px;
      align-items: center;
    }

    .table-head {
      padding-bottom: 5px;
      color: var(--muted);
      font-size: clamp(10px, 0.9vw, 12px);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-row {
      padding: 5px 0;
      font-size: clamp(14px, 1.45vw, 20px);
      line-height: 1.15;
    }

    .score-row + .score-row {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .team-name {
      overflow: hidden;
      font-weight: 850;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .score {
      font-weight: 950;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      color: var(--muted);
      font-size: clamp(13px, 1.2vw, 18px);
      font-weight: 750;
    }

    .ticker {
      position: absolute;
      left: 3vw;
      right: 3vw;
      bottom: 4vh;
      height: clamp(42px, 4.8vw, 58px);
      display: flex;
      overflow: hidden;
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
    }

    .ticker-viewport {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      height: 100%;
      animation: ticker-scroll var(--ticker-duration, 34s) linear infinite;
      will-change: transform;
    }

    .ticker-copy {
      display: flex;
      align-items: center;
      gap: 34px;
      padding: 0 22px;
      white-space: nowrap;
    }

    .ticker-item {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      font-size: clamp(15px, 1.6vw, 23px);
      line-height: 1;
    }

    .ticker-team {
      font-weight: 850;
    }

    .ticker-score {
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .ticker-info {
      display: grid;
      place-items: center;
      min-width: clamp(104px, 10vw, 150px);
      padding: 0 12px;
      border-left: 1px solid var(--line);
      background: var(--panel-strong);
      font-size: clamp(11px, 1vw, 15px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (max-aspect-ratio: 4 / 3) {
      .compact-box {
        width: min(360px, 54vw);
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section id="compactBox" class="compact-box hidden" aria-live="polite">
      <div id="boxTitle" class="box-title">Peltola Open</div>
      <div id="boxSubtitle" class="box-subtitle">Before round</div>
      <div class="table-head">
        <div>Team</div>
        <div class="score">Score</div>
      </div>
      <div id="scoreRows"></div>
    </section>

    <section id="ticker" class="ticker hidden" aria-live="polite">
      <div class="ticker-viewport">
        <div id="tickerTrack" class="ticker-track"></div>
      </div>
      <div id="tickerInfo" class="ticker-info">Before round</div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const params = new URLSearchParams(location.search);
    const eventId = params.get("event") || "2026";
    const maxRows = Number(params.get("rows") || 12);
    const forcedMode = params.get("mode");

    if (params.get("debug") === "1") {
      document.body.classList.add("debug");
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const compactBoxEl = document.getElementById("compactBox");
    const boxTitleEl = document.getElementById("boxTitle");
    const boxSubtitleEl = document.getElementById("boxSubtitle");
    const scoreRowsEl = document.getElementById("scoreRows");
    const tickerEl = document.getElementById("ticker");
    const tickerTrackEl = document.getElementById("tickerTrack");
    const tickerInfoEl = document.getElementById("tickerInfo");

    onValue(ref(db, `events/${eventId}`), snapshot => {
      const event = snapshot.val();
      renderOverlay(event);
    });

    function renderOverlay(event) {
      if (!event || event.showStandings === false) {
        compactBoxEl.classList.add("hidden");
        tickerEl.classList.add("hidden");
        return;
      }

      const mode = forcedMode || event.overlayMode || "compact";
      const completedThrough = getCompletedThrough(event);
      const label = formatPlayedLabel(completedThrough);
      const standings = calculateStandings(event, completedThrough);

      if (mode === "ticker") {
        renderTicker(event, standings, completedThrough, label);
      } else {
        renderCompactBox(event, standings, completedThrough, label);
      }
    }

    function renderCompactBox(event, standings, completedThrough, label) {
      tickerEl.classList.add("hidden");
      compactBoxEl.classList.remove("hidden");

      boxTitleEl.textContent = event.name || "Peltola Open";
      boxSubtitleEl.textContent = label;

      const rows = standings.slice(0, maxRows);
      scoreRowsEl.innerHTML = rows.length
        ? rows.map(team => `
          <div class="score-row">
            <div class="team-name">${escapeHtml(team.name)}</div>
            <div class="score">${completedThrough ? formatToPar(team.toPar) : "--"}</div>
          </div>
        `).join("")
        : `<div class="empty">Add teams in the control panel.</div>`;
    }

    function renderTicker(event, standings, completedThrough, label) {
      compactBoxEl.classList.add("hidden");
      tickerEl.classList.remove("hidden");

      tickerInfoEl.textContent = completedThrough ? `Through ${completedThrough}` : "Before round";

      const content = standings.length
        ? standings.map(team => `
          <span class="ticker-item">
            <span class="ticker-team">${escapeHtml(team.name)}</span>
            <span class="ticker-score">${completedThrough ? formatToPar(team.toPar) : "--"}</span>
          </span>
        `).join("")
        : `<span class="ticker-item"><span class="ticker-team">Add teams in the control panel</span></span>`;

      tickerTrackEl.innerHTML = `
        <div class="ticker-copy">${content}</div>
        <div class="ticker-copy" aria-hidden="true">${content}</div>
      `;

      const durationSeconds = Math.max(26, Math.min(70, standings.length * 5 + 18));
      tickerTrackEl.style.setProperty("--ticker-duration", `${durationSeconds}s`);
    }

    function getCompletedThrough(event) {
      const teams = Object.values(event.teams || {});
      if (!teams.length) return 0;

      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      let completedThrough = 0;

      for (let hole = 1; hole <= holeCount; hole += 1) {
        const holeKey = String(hole);
        const everyTeamHasScore = teams.every(team => {
          const score = Number(team.scores?.[holeKey]);
          return Number.isFinite(score) && score > 0;
        });

        if (!everyTeamHasScore) break;
        completedThrough = hole;
      }

      return completedThrough;
    }

    function calculateStandings(event, completedThrough) {
      const holes = event.holes || {};
      const teams = event.teams || {};

      return Object.entries(teams).map(([teamId, team], index) => {
        let strokes = 0;
        let par = 0;

        for (let hole = 1; hole <= completedThrough; hole += 1) {
          const holeKey = String(hole);
          const score = Number(team.scores?.[holeKey]);
          const holePar = Number(holes[holeKey]?.par || 0);

          if (Number.isFinite(score) && score > 0) {
            strokes += score;
            par += holePar;
          }
        }

        return {
          id: teamId,
          name: team.name || `Team ${index + 1}`,
          order: Number(team.order || index + 1),
          strokes,
          par,
          toPar: strokes - par
        };
      }).sort((a, b) => {
        if (!completedThrough) return a.order - b.order || a.name.localeCompare(b.name);
        return a.toPar - b.toPar || a.strokes - b.strokes || a.order - b.order || a.name.localeCompare(b.name);
      });
    }

    function formatPlayedLabel(completedThrough) {
      if (!completedThrough) return "Before round";
      if (completedThrough === 1) return "Through 1 hole";
      return `Through ${completedThrough} holes`;
    }

    function formatToPar(value) {
      if (value === 0) return "E";
      return value > 0 ? `+${value}` : String(value);
    }

    function clampInt(value, min, max) {
      const number = Number.parseInt(value, 10);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }
  </script>
</body>
</html>
