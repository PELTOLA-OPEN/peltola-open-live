<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peltola Open Scorecard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1412;
      --panel: rgba(0, 0, 0, 0.68);
      --panel-strong: rgba(0, 0, 0, 0.78);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.32);
      --accent: #d8f15a;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(216, 241, 90, 0.12), transparent 34vw),
        linear-gradient(135deg, #102018, #101318);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .page {
      width: max-content;
      max-width: 100%;
    }

    .scorecard {
      width: max-content;
      max-width: 100%;
      padding: 16px;
      border: 2px solid rgba(255, 255, 255, 0.62);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .title {
      min-width: 0;
      overflow: hidden;
      font-size: clamp(19px, 3vw, 36px);
      font-weight: 950;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      flex: none;
      color: var(--muted);
      font-size: clamp(12px, 1.5vw, 18px);
      font-weight: 950;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .view-tabs {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .view-tab {
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .view-tab.active {
      border-color: rgba(216, 241, 90, 0.68);
      background: rgba(216, 241, 90, 0.16);
      color: var(--accent);
    }

    .table-wrap {
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: max-content;
      min-width: 0;
      border-collapse: collapse;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      height: 34px;
      border: 1px solid var(--line);
      padding: 2px 4px;
      text-align: center;
      vertical-align: middle;
      line-height: 1;
    }

    th {
      background: rgba(255, 255, 255, 0.12);
      font-size: clamp(10px, 1.2vw, 14px);
      font-weight: 950;
      text-transform: uppercase;
    }

    td {
      font-size: clamp(11px, 1.45vw, 17px);
      font-weight: 850;
    }

    .player {
      position: sticky;
      left: 0;
      z-index: 2;
      width: 1%;
      max-width: min(320px, 54vw);
      background: var(--panel-strong);
      text-align: left;
      padding-left: 7px;
      padding-right: 21px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    thead .player { z-index: 4; }

    .hole {
      width: 32px;
      min-width: 32px;
      max-width: 32px;
      text-align: center !important;
      vertical-align: middle !important;
    }

    .total {
      position: sticky;
      right: 0;
      z-index: 2;
      width: 54px;
      min-width: 54px;
      max-width: 54px;
      background: var(--panel-strong);
      font-weight: 950;
    }

    thead .total { z-index: 4; }

    .par-row td {
      color: var(--muted);
      font-size: clamp(10px, 1.15vw, 13px);
      font-weight: 900;
    }

    .score-mark {
      display: inline-grid;
      place-items: center;
      width: 24px;
      min-width: 24px;
      max-width: 24px;
      height: 24px;
      min-height: 24px;
      max-height: 24px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 999px;
      color: #ffffff;
      line-height: 1;
      font-weight: 950;
      text-align: center;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .score-cell-fill { font-weight: 950 !important; }
    .mark-albatross { background: #245f9e; }
    .mark-birdie { background: #6db7f2; }
    .mark-bogey { background: #e3a17d; color: #111111; }
    .mark-double { background: #d86431; color: #111111; }
    .mark-triple { background: #d10f0f; color: #111111; }
    .mark-quad { background: #b90000; color: #111111; }

    .empty-cell { color: rgba(255, 255, 255, 0.32); }
    .hide { display: none !important; }

    .pickem-wrap {
      display: grid;
      gap: 14px;
      width: min(960px, calc(100vw - 72px));
      max-width: 100%;
    }

    .pickem-summary {
      width: 100%;
      min-width: 0;
      table-layout: auto;
    }

    .pickem-summary th,
    .pickem-summary td {
      height: 30px;
      padding: 3px 6px;
      font-size: clamp(10px, 1.55vw, 13px);
      line-height: 1.05;
      white-space: nowrap;
    }

    .pickem-summary .pos-cell {
      width: 10%;
      min-width: 38px;
      padding-left: 3px;
      padding-right: 3px;
    }

    .pickem-summary .name-cell {
      width: auto;
      max-width: min(360px, 42vw);
      padding-left: 8px;
      padding-right: 10px;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pickem-summary .metric-cell {
      width: 16%;
      min-width: 50px;
      padding-left: 4px;
      padding-right: 4px;
    }

    .pickem-summary .wide-metric-cell {
      width: 19%;
      min-width: 72px;
      padding-left: 4px;
      padding-right: 4px;
    }

    .pickem-detail-spacer {
      height: 108px;
    }

    .pickem-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .pickem-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
    }

    .pickem-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
      text-transform: uppercase;
    }

    .pickem-card table {
      width: 100%;
      min-width: 0;
    }

    .pickem-card th,
    .pickem-card td {
      height: 27px;
      font-size: 12px;
    }

    .pickem-card .team-cell {
      text-align: left;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pickem-card th.team-cell {
      text-align: left;
    }

    .pickem-meta {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 760px) {
      body {
        display: block;
        min-height: 100vh;
        padding: 10px;
      }

      .scorecard {
        padding: 10px;
        border-radius: 14px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      .title { width: 100%; font-size: 20px; }
      .subtitle { font-size: 12px; }

      th,
      td {
        height: 28px;
        padding: 1px 3px;
      }

      .page,
      .scorecard {
        width: 100%;
        max-width: 100%;
      }

      .table-wrap {
        width: 100%;
        max-width: 100%;
      }

      .player {
        width: 1%;
        max-width: 62vw;
        padding-left: 5px;
        padding-right: 15px;
      }

      .hole {
        width: 27px;
        min-width: 27px;
        max-width: 27px;
      }

      .score-mark {
        width: 20px;
        min-width: 20px;
        max-width: 20px;
        height: 20px;
        min-height: 20px;
        max-height: 20px;
      }

      .total {
        width: 44px;
        min-width: 44px;
        max-width: 44px;
      }

      .pickem-wrap { width: 100%; }
      .pickem-summary th,
      .pickem-summary td {
        height: 26px;
        font-size: 9px;
        padding: 1px 2px;
      }
      .pickem-summary .pos-cell {
        min-width: 30px;
      }
      .pickem-summary .name-cell {
        max-width: 31vw;
        padding-left: 4px;
        padding-right: 4px;
      }
      .pickem-summary .metric-cell {
        min-width: 34px;
        padding-left: 2px;
        padding-right: 2px;
      }
      .pickem-summary .wide-metric-cell {
        min-width: 52px;
        padding-left: 2px;
        padding-right: 2px;
      }
      .pickem-detail-spacer { height: 104px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="scorecard" aria-live="polite">
      <div class="header">
        <div id="title" class="title">Peltola Open</div>
        <div id="subtitle" class="subtitle">Loading</div>
      </div>
      <nav class="view-tabs" aria-label="Scorecard views">
        <button id="viewScorecardBtn" class="view-tab active" type="button">Scorecard</button>
        <button id="viewPickemsBtn" class="view-tab" type="button">Pickems</button>
      </nav>
      <section id="scorecardPanel">
        <div id="tableWrap" class="table-wrap"></div>
      </section>
      <section id="pickemsPanel" class="hide">
        <div id="pickemsWrap" class="pickem-wrap"></div>
      </section>
    </section>
    <div id="status" class="status"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const params = new URLSearchParams(location.search);
    const eventId = params.get("event") || "2026";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const tableWrapEl = document.getElementById("tableWrap");
    const pickemsWrapEl = document.getElementById("pickemsWrap");
    const statusEl = document.getElementById("status");
    const viewScorecardBtn = document.getElementById("viewScorecardBtn");
    const viewPickemsBtn = document.getElementById("viewPickemsBtn");
    const scorecardPanel = document.getElementById("scorecardPanel");
    const pickemsPanel = document.getElementById("pickemsPanel");

    let activeView = "scorecard";
    let latestEvent = null;

    window.addEventListener("error", event => showRuntimeError(event.error || event.message));
    window.addEventListener("unhandledrejection", event => showRuntimeError(event.reason));

    viewScorecardBtn.addEventListener("click", () => setActiveView("scorecard"));
    viewPickemsBtn.addEventListener("click", () => setActiveView("pickems"));

    setActiveView("scorecard");

    onValue(
      ref(db, `events/${eventId}`),
      snapshot => {
        latestEvent = snapshot.val();
        renderEvent(latestEvent);
      },
      error => showRuntimeError(error)
    );

    function setActiveView(view) {
      activeView = view === "pickems" ? "pickems" : "scorecard";
      scorecardPanel.classList.toggle("hide", activeView !== "scorecard");
      pickemsPanel.classList.toggle("hide", activeView !== "pickems");
      viewScorecardBtn.classList.toggle("active", activeView === "scorecard");
      viewPickemsBtn.classList.toggle("active", activeView === "pickems");
      if (latestEvent) renderEvent(latestEvent);
    }

    function renderEvent(event) {
      try {
        if (!event) {
          titleEl.textContent = "Peltola Open";
          subtitleEl.textContent = "No event data";
          tableWrapEl.innerHTML = "";
          pickemsWrapEl.innerHTML = "";
          statusEl.textContent = "Open the control panel first to create this event.";
          return;
        }

        titleEl.textContent = event.name || "Peltola Open";
        const completedThrough = getCompletedThrough(event);
        subtitleEl.textContent = formatPlayedLabel(completedThrough);
        statusEl.textContent = `Live data · Event ${eventId}`;

        if (activeView === "pickems") renderPickems(event);
        else renderScorecard(event);
      } catch (error) {
        showRuntimeError(error);
      }
    }

    function renderScorecard(event) {
      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      const completedThrough = getCompletedThrough(event);
      const standings = assignPositions(calculateStandings(event, completedThrough));

      const headerCells = Array.from({ length: holeCount }, (_, index) => `<th class="hole">${index + 1}</th>`).join("");
      const parCells = Array.from({ length: holeCount }, (_, index) => {
        const par = Number(event.holes?.[String(index + 1)]?.par || 0);
        return `<td class="hole">${par || "-"}</td>`;
      }).join("");

      const colorMode = getScorecardColorMode(event);
      const rows = standings.map(team => {
        const holeCells = Array.from({ length: holeCount }, (_, index) => {
          const hole = index + 1;
          const holeKey = String(hole);
          const score = Number(event.teams?.[team.id]?.scores?.[holeKey]);
          const par = Number(event.holes?.[holeKey]?.par || 0);
          if (!Number.isFinite(score) || score <= 0 || !Number.isFinite(par) || par <= 0) return `<td class="hole empty-cell">·</td>`;
          return renderScoreHoleCell(score, par, colorMode);
        }).join("");

        return `
          <tr>
            <td class="player">${escapeHtml(team.positionLabel)} - ${escapeHtml(team.name)}</td>
            ${holeCells}
            <td class="total">${completedThrough ? formatToPar(team.toPar) : "--"}</td>
          </tr>
        `;
      }).join("");

      tableWrapEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th class="player">Team</th>
              ${headerCells}
              <th class="total">Total</th>
            </tr>
          </thead>
          <tbody>
            <tr class="par-row">
              <td class="player">Par</td>
              ${parCells}
              <td class="total"></td>
            </tr>
            ${rows || `<tr><td class="player">Add teams</td><td colspan="${holeCount + 1}"></td></tr>`}
          </tbody>
        </table>
      `;
    }

    function renderPickems(event) {
      const teams = getTeams(event);
      const pickems = getPickems(event, teams);
      const completedThrough = getCompletedThrough(event);
      const actualStandings = assignPositions(calculateStandings(event, completedThrough));
      const actualRanges = buildActualRanges(actualStandings);
      const actualBirdies = countBirdies(event, completedThrough);

      if (!teams.length) {
        pickemsWrapEl.innerHTML = `<p class="status">Add teams before using pickems.</p>`;
        return;
      }
      if (!pickems.length) {
        pickemsWrapEl.innerHTML = `<p class="status">No pickems entered yet.</p>`;
        return;
      }

      const rows = assignPickemPositions(pickems.map(pickem => scorePickem(pickem, teams, actualRanges, actualBirdies)));

      const summaryRows = rows.map(row => `
        <tr>
          <td class="pos-cell">${escapeHtml(row.positionLabel)}</td>
          <td class="name-cell">${escapeHtml(row.name)}</td>
          <td class="metric-cell">${row.placementPenalty}</td>
          <td class="wide-metric-cell">${row.birdiesPrediction}</td>
          <td class="wide-metric-cell">${actualBirdies}</td>
        </tr>
      `).join("");

      const detailCards = rows.map(row => `
        <article class="pickem-card">
          <h3>${escapeHtml(row.positionLabel)} - ${escapeHtml(row.name)}</h3>
          <div class="pickem-meta">Placement penalty ${row.placementPenalty} · Birdie prediction ${row.birdiesPrediction} · Birdies now ${actualBirdies}</div>
          <table>
            <thead>
              <tr><th>Pick</th><th class="team-cell">Team</th><th>Live</th><th>Penalty</th></tr>
            </thead>
            <tbody>
              ${row.details.map(detail => `
                <tr>
                  <td>${detail.predictedPosition}</td>
                  <td class="team-cell">${escapeHtml(detail.teamName)}</td>
                  <td>${escapeHtml(detail.livePositionLabel)}</td>
                  <td>${detail.penalty}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </article>
      `).join("");

      pickemsWrapEl.innerHTML = `
        <div class="table-wrap">
          <table class="pickem-summary">
            <thead>
              <tr>
                <th class="pos-cell">Pos</th>
                <th class="name-cell">Participant</th>
                <th class="metric-cell">Score</th>
                <th class="wide-metric-cell">Birdie prediction</th>
                <th class="wide-metric-cell">Birdies now</th>
              </tr>
            </thead>
            <tbody>${summaryRows}</tbody>
          </table>
        </div>
        <div class="pickem-detail-spacer" aria-hidden="true"></div>
        <div class="pickem-detail-grid">${detailCards}</div>
      `;
    }

    function getTeams(event) {
      return Object.entries(event.teams || {})
        .map(([id, team], index) => ({ id, name: team.name || `Team ${index + 1}`, order: Number(team.order || index + 1) }))
        .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
    }

    function getPickems(event, teams) {
      return Object.entries(event.pickems || {})
        .map(([id, pickem], index) => ({
          id,
          name: pickem.name || `Participant ${index + 1}`,
          order: Number(pickem.order || index + 1),
          birdiesPrediction: clampInt(pickem.birdiesPrediction || 0, 0, 999),
          picks: normalizePickemPicks(pickem.picks, teams)
        }))
        .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
    }

    function normalizePickemPicks(picks, teams) {
      const validIds = new Set(teams.map(team => team.id));
      const normalized = Array.isArray(picks) ? picks.filter(teamId => validIds.has(teamId)) : [];
      for (const team of teams) {
        if (!normalized.includes(team.id)) normalized.push(team.id);
      }
      return normalized.slice(0, teams.length);
    }

    function scorePickem(pickem, teams, actualRanges, actualBirdies) {
      const teamNames = new Map(teams.map(team => [team.id, team.name]));
      let placementPenalty = 0;
      let exactCorrect = 0;
      const details = pickem.picks.map((teamId, index) => {
        const predictedPosition = index + 1;
        const range = actualRanges.get(teamId);
        let penalty = teams.length;
        let livePositionLabel = "--";
        if (range) {
          livePositionLabel = range.start === range.end ? formatOrdinal(range.start) : `${formatOrdinal(range.start)}-${formatOrdinal(range.end)}`;
          if (predictedPosition < range.start) penalty = range.start - predictedPosition;
          else if (predictedPosition > range.end) penalty = predictedPosition - range.end;
          else penalty = 0;
        }
        if (penalty === 0) exactCorrect += 1;
        placementPenalty += penalty;
        return {
          predictedPosition,
          teamName: teamNames.get(teamId) || "Unknown team",
          livePositionLabel,
          penalty
        };
      });

      const birdieDiff = Math.abs(pickem.birdiesPrediction - actualBirdies);
      return { ...pickem, placementPenalty, birdieDiff, exactCorrect, details };
    }

    function buildActualRanges(standings) {
      const ranges = new Map();
      let index = 0;
      while (index < standings.length) {
        const start = index + 1;
        const key = `${standings[index].toPar}|${standings[index].strokes}`;
        let endIndex = index;
        while (endIndex + 1 < standings.length && `${standings[endIndex + 1].toPar}|${standings[endIndex + 1].strokes}` === key) endIndex += 1;
        const end = endIndex + 1;
        for (let i = index; i <= endIndex; i += 1) ranges.set(standings[i].id, { start, end });
        index = endIndex + 1;
      }
      return ranges;
    }

    function assignPickemPositions(rows) {
      const sorted = [...rows].sort((a, b) =>
        a.placementPenalty - b.placementPenalty ||
        a.birdieDiff - b.birdieDiff ||
        b.exactCorrect - a.exactCorrect ||
        a.name.localeCompare(b.name)
      );
      let previousKey = null;
      let previousRank = 0;
      return sorted.map((row, index) => {
        const key = `${row.placementPenalty}|${row.birdieDiff}`;
        const rank = previousKey !== null && key === previousKey ? previousRank : index + 1;
        previousKey = key;
        previousRank = rank;
        return { ...row, rank, positionLabel: formatOrdinal(rank) };
      });
    }

    function countBirdies(event, completedThrough) {
      let birdies = 0;
      for (const team of Object.values(event.teams || {})) {
        for (let hole = 1; hole <= completedThrough; hole += 1) {
          const holeKey = String(hole);
          const score = Number(team.scores?.[holeKey]);
          const par = Number(event.holes?.[holeKey]?.par || 0);
          if (Number.isFinite(score) && Number.isFinite(par) && score - par === -1) birdies += 1;
        }
      }
      return birdies;
    }

    function getCompletedThrough(event) {
      const teams = Object.values(event.teams || {});
      if (!teams.length) return 0;
      const holeCount = clampInt(event.holeCount || 18, 1, 36);
      let completedThrough = 0;
      for (let hole = 1; hole <= holeCount; hole += 1) {
        const holeKey = String(hole);
        const everyTeamHasScore = teams.every(team => {
          const score = Number(team.scores?.[holeKey]);
          return Number.isFinite(score) && score > 0;
        });
        if (!everyTeamHasScore) break;
        completedThrough = hole;
      }
      return completedThrough;
    }

    function calculateStandings(event, completedThrough) {
      const holes = event.holes || {};
      const teams = event.teams || {};
      return Object.entries(teams).map(([teamId, team], index) => {
        let strokes = 0;
        let par = 0;
        for (let hole = 1; hole <= completedThrough; hole += 1) {
          const holeKey = String(hole);
          const score = Number(team.scores?.[holeKey]);
          const holePar = Number(holes[holeKey]?.par || 0);
          if (Number.isFinite(score) && score > 0) {
            strokes += score;
            par += holePar;
          }
        }
        return {
          id: teamId,
          name: team.name || `Team ${index + 1}`,
          order: Number(team.order || index + 1),
          strokes,
          par,
          toPar: strokes - par
        };
      }).sort((a, b) => {
        if (!completedThrough) return a.order - b.order || a.name.localeCompare(b.name);
        return a.toPar - b.toPar || a.strokes - b.strokes || a.order - b.order || a.name.localeCompare(b.name);
      });
    }

    function assignPositions(standings) {
      let previousKey = null;
      let previousRank = 0;
      return standings.map((team, index) => {
        const key = `${team.toPar}|${team.strokes}`;
        const rank = previousKey !== null && key === previousKey ? previousRank : index + 1;
        previousKey = key;
        previousRank = rank;
        return { ...team, rank, positionLabel: formatOrdinal(rank) };
      });
    }

    function renderScoreHoleCell(score, par, colorMode) {
      const relative = score - par;
      const className = getScoreMarkClass(relative);
      if (!className) return `<td class="hole">${score}</td>`;
      if (colorMode === "cell") return `<td class="hole score-cell-fill ${className}">${score}</td>`;
      return `<td class="hole"><span class="score-mark ${className}">${score}</span></td>`;
    }

    function getScorecardColorMode(event) {
      return event.scorecardColorMode === "cell" ? "cell" : "circle";
    }

    function getScoreMarkClass(relative) {
      if (relative <= -2) return "mark-albatross";
      if (relative === -1) return "mark-birdie";
      if (relative === 1) return "mark-bogey";
      if (relative === 2) return "mark-double";
      if (relative === 3) return "mark-triple";
      if (relative >= 4) return "mark-quad";
      return "";
    }

    function formatPlayedLabel(completedThrough) {
      if (!completedThrough) return "Before round";
      if (completedThrough === 1) return "Through 1 hole";
      return `Through ${completedThrough} holes`;
    }

    function formatOrdinal(value) {
      const v = Math.abs(Number(value));
      const mod100 = v % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${v}th`;
      switch (v % 10) {
        case 1: return `${v}st`;
        case 2: return `${v}nd`;
        case 3: return `${v}rd`;
        default: return `${v}th`;
      }
    }

    function formatToPar(value) {
      if (value === 0) return "E";
      return value > 0 ? `+${value}` : String(value);
    }

    function clampInt(value, min, max) {
      const number = Number.parseInt(value, 10);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function showRuntimeError(error) {
      console.error(error);
      const message = error?.message || String(error || "Unknown error");
      titleEl.textContent = "Peltola Open";
      subtitleEl.textContent = "Error";
      statusEl.textContent = `Scorecard error: ${message}`;
    }
  </script>
</body>
</html>
